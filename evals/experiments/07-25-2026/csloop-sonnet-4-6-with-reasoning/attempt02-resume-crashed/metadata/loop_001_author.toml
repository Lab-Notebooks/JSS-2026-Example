content = "! Fortran shim for atree: calls the C++ implementation via atree_wrapper.\n! SPDX-License-Identifier: GPL-3.0-or-later\n! Copyright (C) 2019-2022, respective authors of MCFM.\n\nfunction atree(st, j1, j2, j3, j4, j5, j6, za, zb)\n  use types\n  use mxpart_mod\n  use iso_c_binding\n  implicit none\n  complex(dp) :: atree\n  character(len=2), intent(in) :: st\n  integer, intent(in) :: j1, j2, j3, j4, j5, j6\n  complex(dp), intent(in) :: za(mxpart,mxpart), zb(mxpart,mxpart)\n  integer :: ist\n\n  interface\n    function atree_wrapper(ist, fj1, fj2, fj3, fj4, fj5, fj6, fza, fzb) &\n        bind(C, name=\"atree_wrapper\")\n      use iso_c_binding\n      complex(c_double_complex) :: atree_wrapper\n      integer(c_int), value :: ist, fj1, fj2, fj3, fj4, fj5, fj6\n      complex(c_double_complex), intent(in) :: fza(*), fzb(*)\n    end function atree_wrapper\n  end interface\n\n  ! Encode character(len=2) string as integer: 0='pp', 1='pm', 2='sl'\n  if (st == 'pp') then\n    ist = 0\n  else if (st == 'pm') then\n    ist = 1\n  else\n    ist = 2  ! 'sl'\n  end if\n\n  atree = atree_wrapper(ist, j1, j2, j3, j4, j5, j6, za(1,1), zb(1,1))\nend function atree\n"
