content = "// Fortran -> C++ translation of W2jet/atree.f\n// SPDX-License-Identifier: GPL-3.0-or-later\n// Copyright (C) 2019-2022, respective authors of MCFM.\n\n#include <atree.hpp>\n#include <W1jet.hpp>     // extern double t(int,int,int)\n#include <FArray.hpp>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <complex>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\n// st: 0='pp', 1='pm', 2='sl'\nstd::complex<double> atree(int st, int j1, int j2, int j3, int j4, int j5, int j6,\n                            FArray2D<std::complex<double>>& za,\n                            FArray2D<std::complex<double>>& zb) {\n    // Fortran statement function 'tree' → C++ lambda\n    // tree(j1,j2,j3,j4,j5,j6) implements BDKW Eq.(3.10) (all amplitudes / im)\n    auto tree = [&](int a1, int a2, int a3, int a4, int a5, int a6)\n        -> std::complex<double>\n    {\n        return +zb(a1,a2)*za(a5,a4)*(za(a3,a1)*zb(a1,a6)+za(a3,a2)*zb(a2,a6))\n               / (s(a2,a3)*s(a5,a6)*t(a1,a2,a3))\n             + za(a3,a4)*zb(a6,a1)*(za(a5,a3)*zb(a3,a2)+za(a5,a4)*zb(a4,a2))\n               / (s(a2,a3)*s(a5,a6)*t(a2,a3,a4));\n    };\n\n    std::complex<double> result{0.0, 0.0};\n    if (st == 0) {        // 'pp'\n        result = +tree(j1,j2,j3,j4,j5,j6);\n    } else if (st == 1) { // 'pm'\n        result = -tree(j1,j3,j2,j4,j5,j6);\n    } else {              // 'sl' — auxiliary quantity, not a real tree amplitude\n        result = -tree(j3,j1,j2,j4,j5,j6);\n    }\n    // @coverage-probe\n    return result;\n}\n\nextern \"C\" {\n  std::complex<double> atree_wrapper(int ist, int j1, int j2, int j3, int j4, int j5, int j6,\n                                      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return atree(ist, j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
