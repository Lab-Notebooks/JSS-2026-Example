content = "! Fortran shim for subqcd: calls the C++ implementation via subqcd_wrapper.\n! SPDX-License-Identifier: GPL-3.0-or-later\n! Copyright (C) 2019-2022, respective authors of MCFM.\n\nsubroutine subqcd(i1, i2, i3, i4, i5, i6, za, zb, amp)\n  use types\n  use mxpart_mod\n  use iso_c_binding\n  implicit none\n  integer, intent(in) :: i1, i2, i3, i4, i5, i6\n  complex(dp), intent(in)  :: za(mxpart,mxpart), zb(mxpart,mxpart)\n  complex(dp), intent(out) :: amp(-1:1,-1:1)\n\n  interface\n    subroutine subqcd_wrapper(pi1, pi2, pi3, pi4, pi5, pi6, fza, fzb, famp) &\n        bind(C, name=\"subqcd_wrapper\")\n      use iso_c_binding\n      integer(c_int), intent(in) :: pi1, pi2, pi3, pi4, pi5, pi6\n      complex(c_double_complex), intent(in)  :: fza(*), fzb(*)\n      complex(c_double_complex), intent(out) :: famp(*)\n    end subroutine subqcd_wrapper\n  end interface\n\n  call subqcd_wrapper(i1, i2, i3, i4, i5, i6, za(1,1), zb(1,1), amp(-1,-1))\nend subroutine subqcd\n"
