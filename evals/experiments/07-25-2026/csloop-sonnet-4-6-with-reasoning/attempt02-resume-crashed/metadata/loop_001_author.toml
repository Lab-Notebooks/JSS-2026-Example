content = "// Fortran -> C++ translation of W2jet/subqcd.f\n// SPDX-License-Identifier: GPL-3.0-or-later\n// Copyright (C) 2019-2022, respective authors of MCFM.\n\n#include <subqcd.hpp>\n#include <FArray.hpp>\n#include <constants_mod.hpp>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <complex>\n\nusing namespace constants_mod;\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\n// Helicity amplitudes for q(-p1)+qbar(-p2) --> l(p3)+lbar(p4)+g(p5)+g(p6)\n// amp(-1:1,-1:1) stored column-major: amp(i,j) = amp_ptr[(i+1)+(j+1)*3]\nvoid subqcd(int i1, int i2, int i3, int i4, int i5, int i6,\n            FArray2D<std::complex<double>>& za,\n            FArray2D<std::complex<double>>& zb,\n            std::complex<double>* amp_ptr) {\n\n    // Fortran statement functions --> C++ lambdas\n    auto zba2 = [&](int a1, int a2, int a3, int a4) -> std::complex<double> {\n        return zb(a1,a2)*za(a2,a4) + zb(a1,a3)*za(a3,a4);\n    };\n    auto zba3 = [&](int a1, int a2, int a3, int a4, int a5) -> std::complex<double> {\n        return zb(a1,a2)*za(a2,a5) + zb(a1,a3)*za(a3,a5) + zb(a1,a4)*za(a4,a5);\n    };\n\n    // amp(i,j) accessor for Fortran-style (-1:1,-1:1) column-major layout\n    auto AMP = [&](int i, int j) -> std::complex<double>& {\n        return amp_ptr[(i+1) + (j+1)*3];\n    };\n\n    double s156 = s(i1,i5) + s(i1,i6) + s(i5,i6);\n    double s256 = s(i2,i5) + s(i2,i6) + s(i5,i6);\n    // s56 and s34 kept for readability (match Fortran local vars)\n    double s56  = s(i5,i6);\n    double s34  = s(i3,i4);\n    (void)s56; (void)s34;  // used via s(i,j) calls below\n\n    AMP(-1,-1) = -four/s(i3,i4)\n        * zb(i1,i4)*zba3(i1,i2,i6,i5,i3)/zb(i1,i5)/zb(i2,i6)/zb(i6,i5);\n\n    AMP(+1,+1) = +four/s(i3,i4)\n        * za(i2,i3)*zba3(i4,i1,i6,i5,i2)/za(i1,i5)/za(i2,i6)/za(i6,i5);\n\n    AMP(+1,-1) = four/(s(i3,i4)*s(i5,i6))\n        * (zba2(i4,i1,i5,i6)*zba2(i5,i2,i6,i3)/za(i1,i5)/zb(i2,i6)\n           - za(i1,i6)*za(i2,i3)*zb(i1,i5)*zba2(i4,i1,i5,i6)/za(i1,i5)/s156\n           - za(i2,i6)*zb(i1,i4)*zb(i2,i5)*zba2(i5,i2,i6,i3)/zb(i2,i6)/s256);\n\n    AMP(-1,+1) = four/(s(i3,i4)*s(i5,i6))\n        * (za(i2,i3)*za(i2,i5)*zb(i1,i4)*zb(i1,i6)/za(i2,i6)/zb(i1,i5)\n           - za(i2,i3)*zb(i1,i6)*zb(i1,i6)*zba2(i4,i1,i6,i5)/zb(i1,i5)/s156\n           - za(i2,i5)*za(i2,i5)*zb(i1,i4)*zba2(i6,i2,i5,i3)/za(i2,i6)/s256);\n    // @coverage-probe\n}\n\nextern \"C\" {\n  void subqcd_wrapper(int* pi1, int* pi2, int* pi3, int* pi4, int* pi5, int* pi6,\n                       std::complex<double>* fza, std::complex<double>* fzb,\n                       std::complex<double>* famp) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    subqcd(*pi1, *pi2, *pi3, *pi4, *pi5, *pi6, za, zb, famp);\n  }\n}\n"
