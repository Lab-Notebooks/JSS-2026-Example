content = "// Fortran -> C++ translation of W2jet/fvf.f\n// SPDX-License-Identifier: GPL-3.0-or-later\n// Copyright (C) 2019-2022, respective authors of MCFM.\n\n#include <fvf.hpp>\n#include <FArray.hpp>\n#include <complex>\n#include <W1jet.hpp>           // extern double t(int,int,int)\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <heldefs_mod.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\nusing namespace heldefs_mod;\n\n// gfortran ABI for complex(dp) functions without bind(C):\n// result returned via hidden first pointer arg; other args passed by pointer.\nextern \"C\" {\n    void i3m_(std::complex<double>* result, double* p0sq, double* m0sq, double* m1sq);\n    void lsm1_2mh_(std::complex<double>* result,\n                   double* a, double* b, double* c, double* d);\n    void lsm1_2me_(std::complex<double>* result,\n                   double* a, double* b, double* c, double* d);\n}\n\n// Thin C++ wrappers that copy args to locals (required for pointer passing)\nstatic std::complex<double> call_I3m(double p0sq, double m0sq, double m1sq) {\n    std::complex<double> r;\n    i3m_(&r, &p0sq, &m0sq, &m1sq);\n    return r;\n}\nstatic std::complex<double> call_Lsm1_2mh(double a, double b, double c, double d) {\n    std::complex<double> r;\n    lsm1_2mh_(&r, &a, &b, &c, &d);\n    return r;\n}\nstatic std::complex<double> call_Lsm1_2me(double a, double b, double c, double d) {\n    std::complex<double> r;\n    lsm1_2me_(&r, &a, &b, &c, &d);\n    return r;\n}\n\nstd::complex<double> Fvf(int st, int j1, int j2, int j3, int j4, int j5, int j6,\n                          FArray2D<std::complex<double>>& za,\n                          FArray2D<std::complex<double>>& zb) {\n    // Statement function: zab2(j1,j2,j3,j4) = za(j1,j2)*zb(j2,j4) + za(j1,j3)*zb(j3,j4)\n    auto zab2 = [&](int a1, int a2, int a3, int a4) -> std::complex<double> {\n        return za(a1,a2)*zb(a2,a4) + za(a1,a3)*zb(a3,a4);\n    };\n\n    // I3m123456 and I3m563412 are computed scalars (not statement functions)\n    std::complex<double> I3m123456 = call_I3m(s(j1,j2), s(j3,j4), s(j5,j6));\n    std::complex<double> I3m563412 = I3m123456;\n\n    std::complex<double> result{0.0, 0.0};\n\n    if (st == hqpqbmgpgm) {\n        result =\n          - zab2(j5,j2,j4,j1)*zab2(j5,j2,j4,j1)\n            / (za(j5,j6)*zb(j1,j2)*zab2(j3,j1,j2,j4)*zab2(j3,j1,j2,j4))\n            * call_Lsm1_2mh(s(j3,j4), t(j1,j2,j4), s(j1,j2), s(j5,j6))\n\n          - zab2(j2,j1,j3,j6)*zab2(j2,j1,j3,j6)\n            / (za(j1,j2)*zb(j5,j6)*zab2(j3,j1,j2,j4)*zab2(j3,j1,j2,j4))\n            * call_Lsm1_2mh(s(j3,j4), t(j1,j2,j3), s(j1,j2), s(j5,j6))\n\n          - I3m123456*za(j4,j5)*zb(j1,j3)\n            * zab2(j2,j1,j3,j6) / (2.0*zab2(j3,j1,j2,j4)*t(j1,j2,j3))\n\n          - I3m123456*za(j2,j4)*zb(j3,j6)\n            * zab2(j5,j2,j4,j1) / (2.0*zab2(j3,j1,j2,j4)*t(j1,j2,j4))\n\n          + I3m563412*za(j2,j4)*zb(j3,j6)\n            * zab2(j5,j3,j6,j1) / (2.0*zab2(j3,j1,j2,j4)*t(j3,j5,j6))\n\n          + I3m563412*za(j4,j5)*zb(j1,j3)\n            * zab2(j2,j4,j5,j6) / (2.0*zab2(j3,j1,j2,j4)*t(j4,j5,j6));\n\n    } else if (st == hqpqbmgpgp) {\n        result = -za(j2,j5)*za(j2,j5)\n                  / (za(j1,j2)*za(j5,j6)*za(j3,j4)*za(j3,j4))\n                  * call_Lsm1_2me(t(j1,j2,j3), t(j1,j2,j4), s(j1,j2), s(j5,j6));\n    }\n\n    std::complex<double> final_result = result; // @coverage-probe\n    return final_result;\n}\n\nextern \"C\" {\n    std::complex<double> fvf_wrapper(int* pst,\n                                      int* pj1, int* pj2, int* pj3, int* pj4, int* pj5, int* pj6,\n                                      std::complex<double>* fza, std::complex<double>* fzb) {\n        FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n        FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n        return Fvf(*pst, *pj1, *pj2, *pj3, *pj4, *pj5, *pj6, za, zb);\n    }\n}\n"
