content = "// Fortran -> C++ translation of W2jet/w2jetsq.f\n// SPDX-License-Identifier: GPL-3.0-or-later\n// Copyright (C) 2019-2022, respective authors of MCFM.\n\n#include <w2jetsq.hpp>\n#include <subqcd.hpp>\n#include <FArray.hpp>\n#include <complex>\n#include <cmath>\n#include <constants_mod.hpp>\n#include <mxpart_mod.hpp>\n#include <lc_mod.hpp>\n#include <mmsq_cs_mod.hpp>\n\nusing namespace constants_mod;\nusing namespace mxpart_mod;\nusing namespace lc_mod;\nusing namespace mmsq_cs_mod;\n\nvoid w2jetsq(int i1, int i2, int i3, int i4, int i5, int i6,\n             FArray2D<std::complex<double>>& za,\n             FArray2D<std::complex<double>>& zb,\n             double& msq) {\n    // Fortran: complex(dp):: qcd1(-1:1,-1:1), qcd2(-1:1,-1:1), qed(-1:1,-1:1)\n    // size 3×3 with start_i=-1, start_j=-1\n    FArray2D<std::complex<double>> qcd1(3, 3, -1, -1);\n    FArray2D<std::complex<double>> qcd2(3, 3, -1, -1);\n    FArray2D<std::complex<double>> qed(3, 3, -1, -1);\n\n    subqcd(i1, i2, i3, i4, i5, i6, za, zb, qcd1.data);\n    subqcd(i1, i2, i3, i4, i6, i5, za, zb, qcd2.data);\n\n    qed(+1,+1) = qcd1(+1,+1) + qcd2(+1,+1);\n    qed(+1,-1) = qcd1(+1,-1) + qcd2(-1,+1);\n    qed(-1,+1) = qcd1(-1,+1) + qcd2(+1,-1);\n    qed(-1,-1) = qcd1(-1,-1) + qcd2(-1,-1);\n\n    // std::norm(z) = |z|^2  (matches Fortran abs(z)**2)\n    double msq1 = std::norm(qcd1(+1,+1)) + std::norm(qcd1(+1,-1))\n                + std::norm(qcd1(-1,+1)) + std::norm(qcd1(-1,-1));\n\n    double msq2 = std::norm(qcd2(+1,+1)) + std::norm(qcd2(+1,-1))\n                + std::norm(qcd2(-1,+1)) + std::norm(qcd2(-1,-1));\n\n    double msqq = std::norm(qed(+1,+1)) + std::norm(qed(+1,-1))\n                + std::norm(qed(-1,+1)) + std::norm(qed(-1,-1));\n\n    mmsq_cs(0,+1,+1) = 0.0;\n    mmsq_cs(1,+1,+1) = 0.0;\n    mmsq_cs(2,+1,+1) = 0.0;\n\n    if (colourchoice == 1 || colourchoice == 0) {\n        mmsq_cs(1,+1,+1) = msq1;\n        mmsq_cs(2,+1,+1) = msq2;\n    }\n    if (colourchoice == 2 || colourchoice == 0) {\n        mmsq_cs(0,+1,+1) = -ninth * msqq;\n    }\n\n    msq = mmsq_cs(0,+1,+1) + mmsq_cs(1,+1,+1) + mmsq_cs(2,+1,+1); // @coverage-probe\n}\n\nextern \"C\" {\n    void w2jetsq_wrapper(int* pi1, int* pi2, int* pi3, int* pi4, int* pi5, int* pi6,\n                          std::complex<double>* fza, std::complex<double>* fzb,\n                          double* fmsq) {\n        FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n        FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n        w2jetsq(*pi1, *pi2, *pi3, *pi4, *pi5, *pi6, za, zb, *fmsq);\n    }\n}\n"
