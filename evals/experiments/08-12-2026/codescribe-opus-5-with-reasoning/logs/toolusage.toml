args = "{\"path\": \"software/mcfm/src/W2jet/atree.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <atree.hpp>\\n#include <complex>\\n#include <string>\\n#include <FArray.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n#include <W1jet.hpp>\\n\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\n\\n//***********************************************************************\\n//     Author: R.K. Ellis                                               *\\n//     July, 1998.                                                      *\\n//***********************************************************************\\n//---- the basic process is atreepp which is the amplitude for\\n//---- q-(p4)+Q(-p2)+l-(-p5) ---> q+(p1)+Q-(p3)+l+(p6)\\n//---- All outgoing particles are right-handed,\\n//---- except Q(p3) which is left-handed\\nstd::complex<double> atree(const std::string& st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                           FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\\n  std::complex<double> atree_value(0.0, 0.0);\\n\\n//-----Note all tree amplitudes divided by im wrt to BDKW paper\\n//-----Statement function for pp (others derived by crossing)\\n//-----This is an implementation of BDKW Eq.(3.10)\\n  auto tree = [&za, &zb](int i1, int i2, int i3, int i4, int i5, int i6) {\\n    return +zb(i1, i2) * za(i5, i4) * (za(i3, i1) * zb(i1, i6) + za(i3, i2) * zb(i2, i6))\\n                / (s(i2, i3) * s(i5, i6) * t(i1, i2, i3))\\n           + za(i3, i4) * zb(i6, i1) * (za(i5, i3) * zb(i3, i2) + za(i5, i4) * zb(i4, i2))\\n                / (s(i2, i3) * s(i5, i6) * t(i2, i3, i4));\\n  };\\n\\n  if (st == \\\"pp\\\") {\\n    atree_value = +tree(j1, j2, j3, j4, j5, j6);\\n  } else if (st == \\\"pm\\\") {\\n    atree_value = -tree(j1, j3, j2, j4, j5, j6);\\n  } else if (st == \\\"sl\\\") {\\n//---this is not a real tree amplitude but it is an auxiliary quantity.\\n    atree_value = -tree(j3, j1, j2, j4, j5, j6);\\n  }\\n\\n  return atree_value;\\n}\\n\\nextern \\\"C\\\" {\\n  std::complex<double> atree_wrapper(const char* st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                                     std::complex<double>* fza, std::complex<double>* fzb) {\\n\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    return atree(std::string(st, 2), j1, j2, j3, j4, j5, j6, za, zb);\\n  }\\n}\\n\"}"
