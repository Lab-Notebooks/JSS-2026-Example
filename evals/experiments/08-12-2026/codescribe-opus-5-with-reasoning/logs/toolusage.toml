args = "{\"path\": \"software/mcfm/src/W2jet/ZZtri12_34LL.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <ZZtri12_34LL.hpp>\\n#include <complex>\\n#include <FArray.hpp>\\n#include <constants_mod.hpp>\\n#include <mxpart_mod.hpp>\\n#include <ggZZcomputemp_mod.hpp>\\n\\nusing namespace constants_mod;\\nusing namespace mxpart_mod;\\nusing namespace ggZZcomputemp_mod;\\n\\nextern \\\"C\\\" {\\n//--- still-Fortran callee: function Tri3masscoeff(j1,j2,j3,j4,j5,j6,za,zb)\\n  std::complex<double> tri3masscoeff_(const int* j1, const int* j2, const int* j3,\\n                                      const int* j4, const int* j5, const int* j6,\\n                                      std::complex<double>* za, std::complex<double>* zb);\\n}\\n\\n//-----Author: R.K. Ellis (September 2013)\\n//-----Triangle coefficient for LL coupling\\n//-----Triangle C0(p12,p34,0,0,0)\\n//-----Tri3masscoeff is taken from BDK (11.6) and (11.7)\\n//-----The full mt^2 dependence is calculated in ZZmassivetri\\n//-----Xpp and Xmp refer to the initial state gluon polarizations\\nstatic void ZZtri12_34LLcore(int j1, int j2, int j3, int j4, int j5, int j6,\\n                             FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb,\\n                             double mt,\\n                             FArray2D<std::complex<double>>& Xpp, FArray2D<std::complex<double>>& Xmp) {\\n  int k1, k2, k3 = 0, k4 = 0, k5 = 0, k6 = 0;\\n\\n  k1 = j1;\\n  k2 = j2;\\n  for (int h3 = 1; h3 <= 2; h3++) {\\n    if (h3 == 1) {\\n      k3 = j3;\\n      k4 = j4;\\n    } else if (h3 == 2) {\\n      k3 = j4;\\n      k4 = j3;\\n    }\\n    for (int h5 = 1; h5 <= 2; h5++) {\\n      if (h5 == 1) {\\n        k5 = j5;\\n        k6 = j6;\\n      } else if (h5 == 2) {\\n        k5 = j6;\\n        k6 = j5;\\n      }\\n\\n//----Helicity 1^+ 2^+\\n      Xpp.fill(czip);\\n\\n      if (computemp) {\\n//----Helicity 1^- 2^+\\n        Xmp(h3, h5) = tri3masscoeff_(&k1, &k2, &k3, &k4, &k5, &k6, za.data, zb.data);   // @coverage-probe\\n      } else {\\n        Xmp(h3, h5) = czip;\\n      }\\n    }\\n  }\\n\\n  return;\\n}\\n\\n//-----Author: R.K. Ellis (September 2013)\\n//-----Triangle coefficient for LL coupling\\n//-----Triangle C0(p12,p34,0,0,0)\\n//-----Tri3masscoeff is taken from BDK (11.6) and (11.7)\\n//-----The full mt^2 dependence is calculated in ZZmassivetri\\n//-----Xpp and Xmp refer to the initial state gluon polarizations\\nvoid ZZtri12_34LL(int j1, int j2, int j3, int j4, int j5, int j6,\\n                  FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb,\\n                  double mt,\\n                  FArray2D<std::complex<double>>& Xpp, FArray2D<std::complex<double>>& Xmp,\\n                  FArray2D<std::complex<double>>& Xpm, FArray2D<std::complex<double>>& Xmm) {\\n\\n  ZZtri12_34LLcore(j1, j2, j3, j4, j5, j6, zb, za, mt, Xpp, Xmp);\\n  for (int h3 = 1; h3 <= 2; h3++) {\\n    for (int h5 = 1; h5 <= 2; h5++) {\\n      Xpm(h3, h5) = Xmp(3 - h3, 3 - h5);\\n      Xmm(h3, h5) = Xpp(3 - h3, 3 - h5);\\n    }\\n  }\\n\\n  ZZtri12_34LLcore(j1, j2, j3, j4, j5, j6, za, zb, mt, Xpp, Xmp);\\n\\n  return;\\n}\\n\\nextern \\\"C\\\" {\\n  void ZZtri12_34LL_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\\n                            std::complex<double>* fza, std::complex<double>* fzb,\\n                            double mt,\\n                            std::complex<double>* fXpp, std::complex<double>* fXmp,\\n                            std::complex<double>* fXpm, std::complex<double>* fXmm) {\\n\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    FArray2D<std::complex<double>> Xpp(fXpp, 2, 2);\\n    FArray2D<std::complex<double>> Xmp(fXmp, 2, 2);\\n    FArray2D<std::complex<double>> Xpm(fXpm, 2, 2);\\n    FArray2D<std::complex<double>> Xmm(fXmm, 2, 2);\\n    ZZtri12_34LL(j1, j2, j3, j4, j5, j6, za, zb, mt, Xpp, Xmp, Xpm, Xmm);\\n  }\\n}\\n\"}"
