args = "{\"path\": \"software/mcfm/src/W2jet/subqcd.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <subqcd.hpp>\\n#include <complex>\\n#include <FArray.hpp>\\n#include <constants_mod.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n\\nusing namespace constants_mod;\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\n\\n//*******************************************************************\\n//     the matrix elements of the\\n//     helicity amplitudes for the QCD process\\n//     q(-p1)+qbar(-p2) --> l(p3)+abar(p4)+g(p5)+g(p6)\\n//     multiplied by ((a+l)^2-M**2)/(a+l)^2/g^4\\n//     one colour ordering only\\n//     left-on quark line only\\n//*******************************************************************\\nvoid subqcd(int i1, int i2, int i3, int i4, int i5, int i6,\\n            FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb,\\n            FArray2D<std::complex<double>>& amp) {\\n  double s156, s56, s256, s34;\\n\\n//begin statement functions\\n  auto zba2 = [&za, &zb](int k1, int k2, int k3, int k4) {\\n    return zb(k1, k2) * za(k2, k4) + zb(k1, k3) * za(k3, k4);\\n  };\\n  auto zba3 = [&za, &zb](int k1, int k2, int k3, int k4, int k5) {\\n    return zb(k1, k2) * za(k2, k5) + zb(k1, k3) * za(k3, k5) + zb(k1, k4) * za(k4, k5);\\n  };\\n//end statement functions\\n\\n  s156 = s(i1, i5) + s(i1, i6) + s(i5, i6);\\n  s256 = s(i2, i5) + s(i2, i6) + s(i5, i6);\\n  s56 = s(i5, i6);\\n  s34 = s(i3, i4);\\n  (void) s56;\\n  (void) s34;\\n\\n  amp(-1, -1) = -four / s(i3, i4) * zb(i1, i4) * zba3(i1, i2, i6, i5, i3) / zb(i1, i5) / zb(i2, i6) / zb(i6, i5);\\n  amp(+1, +1) = +four / s(i3, i4)\\n    * za(i2, i3) * zba3(i4, i1, i6, i5, i2) / za(i1, i5) / za(i2, i6) / za(i6, i5);\\n  amp(+1, -1) = four / (s(i3, i4) * s(i5, i6))\\n    * (zba2(i4, i1, i5, i6) * zba2(i5, i2, i6, i3) / za(i1, i5) / zb(i2, i6)\\n     - za(i1, i6) * za(i2, i3) * zb(i1, i5) * zba2(i4, i1, i5, i6) / za(i1, i5) / s156\\n     - za(i2, i6) * zb(i1, i4) * zb(i2, i5) * zba2(i5, i2, i6, i3) / zb(i2, i6) / s256);\\n  amp(-1, +1) = four / (s(i3, i4) * s(i5, i6))\\n    * (za(i2, i3) * za(i2, i5) * zb(i1, i4) * zb(i1, i6) / za(i2, i6) / zb(i1, i5)\\n     - za(i2, i3) * std::pow(zb(i1, i6), 2) * zba2(i4, i1, i6, i5) / zb(i1, i5) / s156\\n     - std::pow(za(i2, i5), 2) * zb(i1, i4) * zba2(i6, i2, i5, i3) / za(i2, i6) / s256);\\n\\n  return;\\n}\\n\\nextern \\\"C\\\" {\\n  void subqcd_wrapper(int i1, int i2, int i3, int i4, int i5, int i6,\\n                      std::complex<double>* fza, std::complex<double>* fzb,\\n                      std::complex<double>* famp) {\\n\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    FArray2D<std::complex<double>> amp(famp, 3, 3, -1, -1);\\n    subqcd(i1, i2, i3, i4, i5, i6, za, zb, amp);\\n  }\\n}\\n\"}"
