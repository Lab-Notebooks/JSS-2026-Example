args = "{\"path\": \"software/mcfm/src/W2jet/qqbggAxslCoeffs.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <W2jet.hpp>\\n#include <complex>\\n#include <FArray.hpp>\\n#include <qqbggintnames_mod.hpp>\\n#include <constants_mod.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n\\nusing namespace qqbggintnames_mod;\\nusing namespace constants_mod;\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\n\\n// Qed like coefficients\\n//\\n//              6---<----- 5\\n//                    (\\n//                    )\\n//                    (\\n//                    )\\n//                   / \\\\\\n//                  /   \\\\\\n//                 /     \\\\\\n//       1|       /       \\\\\\n//        |      /         \\\\\\n//   3    |cccccc-----<-----cccccccc 4\\n//   ccccc|\\n//       2|\\n//\\n// CCC  QED delta function piece\\nvoid qqbggAxslCoeffs(int p1, int p2, int p3, int p4, int p5, int p6,\\n                     FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb,\\n                     double& mtsq, FArray3D<std::complex<double>>& coeffsl) {\\n  int j, k;\\n  FArray2D<std::complex<double>> ans34(2,2), ans43(2,2);\\n  double s56, s123, s124;\\n\\n  //--- begin statement function\\n  auto s3 = [](int q1, int q2, int q3) { return s(q1,q2) + s(q2,q3) + s(q3,q1); };\\n  auto zab2 = [&za, &zb](int q1, int q2, int q3, int q4) {\\n    return za(q1,q2)*zb(q2,q4) + za(q1,q3)*zb(q3,q4);\\n  };\\n  auto izb = [&zb](int q1, int q2) { return cone/zb(q1,q2); };\\n  auto iza = [&za](int q1, int q2) { return cone/za(q1,q2); };\\n  //--- end statement functions\\n  s56 = s(p5,p6);\\n  s123 = s3(p1,p2,p3);\\n  s124 = s3(p1,p2,p4);\\n\\n  coeffsl.fill(czip);\\n\\n  ans34(2,2) = za(p2,p5)*zb(p4,p6)*zab2(p2,p1,p3,p4)\\n               *iza(p1,p3)*iza(p2,p3)/s56;\\n  ans43(2,2) = za(p2,p5)*zb(p3,p6)*zab2(p2,p1,p4,p3)\\n               *iza(p1,p4)*iza(p2,p4)/s56;\\n\\n  ans34(2,1) = za(p2,p4)*za(p4,p5)*zab2(p2,p1,p3,p6)\\n               *iza(p1,p3)*iza(p2,p3)/s56;\\n  ans43(2,1) = zb(p1,p3)*zb(p3,p6)*zab2(p5,p2,p4,p1)\\n               *izb(p1,p4)*izb(p2,p4)/s56;\\n\\n  ans34(1,2) = zb(p1,p4)*zb(p4,p6)*zab2(p5,p2,p3,p1)\\n               *izb(p1,p3)*izb(p2,p3)/s56;\\n  ans43(1,2) = za(p2,p3)*za(p3,p5)*zab2(p2,p1,p4,p6)\\n               *iza(p1,p4)*iza(p2,p4)/s56;\\n\\n  ans34(1,1) = za(p4,p5)*zb(p1,p6)*zab2(p4,p2,p3,p1)\\n               *izb(p1,p3)*izb(p2,p3)/s56;\\n  ans43(1,1) = za(p3,p5)*zb(p1,p6)*zab2(p3,p2,p4,p1)\\n               *izb(p1,p4)*izb(p2,p4)/s56;\\n\\n  for (j = 1; j <= 2; j++) {\\n    for (k = 1; k <= 2; k++) {\\n      coeffsl(c4_123,j,k) = 2.0*mtsq/(s56-s123)*ans34(j,k);   // @coverage-probe\\n      coeffsl(c3_124,j,k) = 2.0*mtsq/(s56-s124)*ans43(j,k);\\n      coeffsl(b123,j,k) = -1.0/(s56-s123)*(1.0+s123/(s56-s123))*ans34(j,k);\\n      coeffsl(b124,j,k) = -1.0/(s56-s124)*(1.0+s124/(s56-s124))*ans43(j,k);\\n      coeffsl(b56,j,k) = -coeffsl(b123,j,k)-coeffsl(b124,j,k);\\n      coeffsl(rat,j,k) = 1.0/(s56-s123)*ans34(j,k)+1.0/(s56-s124)*ans43(j,k);\\n    }\\n  }\\n\\n  return;\\n}\\n\\nextern \\\"C\\\" {\\n  void qqbggAxslCoeffs_wrapper(int p1, int p2, int p3, int p4, int p5, int p6,\\n                               std::complex<double>* fza, std::complex<double>* fzb,\\n                               double mtsq, std::complex<double>* fcoeffsl) {\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    FArray3D<std::complex<double>> coeffsl(fcoeffsl, 15, 2, 2);\\n    qqbggAxslCoeffs(p1, p2, p3, p4, p5, p6, za, zb, mtsq, coeffsl);\\n  }\\n}\\n\"}"
