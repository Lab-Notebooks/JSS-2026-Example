args = "{\"path\": \"software/mcfm/src/W2jet/w2jetsq.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <W2jet.hpp>\\n#include <cmath>\\n#include <complex>\\n#include <FArray.hpp>\\n#include <constants_mod.hpp>\\n#include <mxpart_mod.hpp>\\n#include <lc_mod.hpp>\\n#include <mmsq_cs_mod.hpp>\\n\\nusing namespace constants_mod;\\nusing namespace mxpart_mod;\\nusing namespace lc_mod;\\nusing namespace mmsq_cs_mod;\\n\\nvoid w2jetsq(int i1, int i2, int i3, int i4, int i5, int i6,\\n             FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb,\\n             double& msq) {\\n  FArray2D<std::complex<double>> qcd1(3, 3, -1, -1);\\n  FArray2D<std::complex<double>> qcd2(3, 3, -1, -1);\\n  FArray2D<std::complex<double>> qed(3, 3, -1, -1);\\n  double msq1, msq2, msqq;\\n\\n  subqcd(i1, i2, i3, i4, i5, i6, za, zb, qcd1);\\n  subqcd(i1, i2, i3, i4, i6, i5, za, zb, qcd2);\\n\\n  qed(+1,+1) = qcd1(+1,+1) + qcd2(+1,+1);\\n  qed(+1,-1) = qcd1(+1,-1) + qcd2(-1,+1);\\n  qed(-1,+1) = qcd1(-1,+1) + qcd2(+1,-1);\\n  qed(-1,-1) = qcd1(-1,-1) + qcd2(-1,-1);\\n\\n  msq1 = std::pow(std::abs(qcd1(+1,+1)),2) + std::pow(std::abs(qcd1(+1,-1)),2)\\n       + std::pow(std::abs(qcd1(-1,+1)),2) + std::pow(std::abs(qcd1(-1,-1)),2);\\n\\n  msq2 = std::pow(std::abs(qcd2(+1,+1)),2) + std::pow(std::abs(qcd2(+1,-1)),2)\\n       + std::pow(std::abs(qcd2(-1,+1)),2) + std::pow(std::abs(qcd2(-1,-1)),2);\\n\\n  msqq = std::pow(std::abs(qed(+1,+1)),2) + std::pow(std::abs(qed(+1,-1)),2)\\n       + std::pow(std::abs(qed(-1,+1)),2) + std::pow(std::abs(qed(-1,-1)),2);\\n\\n  mmsq_cs(0,+1,+1) = 0.0;\\n  mmsq_cs(1,+1,+1) = 0.0;\\n  mmsq_cs(2,+1,+1) = 0.0;\\n\\n  if ((colourchoice == 1) || (colourchoice == 0)) {\\n    mmsq_cs(1,+1,+1) = msq1;\\n    mmsq_cs(2,+1,+1) = msq2;\\n  }\\n  if ((colourchoice == 2) || (colourchoice == 0)) {\\n    mmsq_cs(0,+1,+1) = -ninth*msqq;\\n  }\\n\\n  msq = mmsq_cs(0,+1,