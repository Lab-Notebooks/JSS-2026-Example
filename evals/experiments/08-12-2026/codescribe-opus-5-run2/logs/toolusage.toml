args = "{\"path\": \"software/mcfm/src/W2jet/atrLLL.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <W2jet.hpp>\\n#include <cmath>\\n#include <complex>\\n#include <FArray.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n#include <masses_mod.hpp>\\n\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\nusing namespace masses_mod;\\n\\n//---atrLLL is the amplitude for\\n//---q+(-p4)+Q+(-p2)+l+(-p5) ---> q-(p1)+Q-(p3)+l-(p6)\\n//---All outgoing particles are left-handed,\\n//---(obtained from atree(pm) all right-handed)\\nstd::complex<double> atrLLL(int j1, int j2, int j3, int j4, int j5, int j6,\\n                            FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\\n  std::complex<double> atrLLL_value;\\n  double prop;\\n\\n  prop = s(5,6)/std::sqrt(std::pow((s(5,6)-std::pow(wmass, 2)), 2)+std::pow((wmass*wwidth), 2));\\n  //---Note interchange of za,zb to effect complex conjugation\\n  //---to get from all right-handed to all left-handed\\n\\n  atrLLL_value = atree(\\\"pm\\\",j1,j2,j3,j4,j5,j6,zb,za)*prop;\\n\\n  std::complex<double> res = atrLLL_value;   // @coverage-probe\\n  return res;\\n}\\n\\nextern \\\"C\\\" {\\n  std::complex<double> atrLLL_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\\n                                      std::complex<double>* fza, std::complex<double>* fzb) {\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    return atrLLL(j1, j2, j3, j4, j5, j6, za, zb);\\n  }\\n}\\n\"}"
