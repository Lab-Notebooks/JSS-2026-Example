args = "{\"path\": \"software/mcfm/src/W2jet/a6.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <W2jet.hpp>\\n#include <complex>\\n#include <FArray.hpp>\\n#include <mxpart_mod.hpp>\\n\\nusing namespace mxpart_mod;\\n\\n//-----switchyard function to direct to pm,pp or st\\nstatic std::complex<double> switchyard(const char* st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                                       FArray2D<std::complex<double>>& za,\\n                                       FArray2D<std::complex<double>>& zb) {\\n  std::complex<double> switchyard_value = 0.0;\\n\\n  auto sel = [st](const char* w) { return st[0] == w[0] && st[1] == w[1]; };\\n\\n  if (sel(\\\"pp\\\")) {\\n    switchyard_value = fpp(j1,j2,j3,j4,j5,j6,za,zb);\\n  } else if (sel(\\\"pm\\\")) {\\n    switchyard_value = fpm(j1,j2,j3,j4,j5,j6,za,zb);\\n  } else if (sel(\\\"sl\\\")) {\\n    switchyard_value = fsl(j1,j2,j3,j4,j5,j6,za,zb);\\n  }\\n\\n  return switchyard_value;\\n}\\n\\n//***********************************************************************\\n//     Author: R.K. Ellis                                               *\\n//     July, 1998.                                                      *\\n//     st is a string to choose between pp,pm or sl                     *\\n//     implementation of Eq. (3.3) of BDKW hep-ph/9610370               *\\n//     character string st can take the value pp,pm or sl               *\\n//***********************************************************************\\nstd::complex<double> a6(const char* st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                        FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\\n  std::complex<double> a6_value;\\n\\n  a6_value = atree(st,j1,j2,j3,j4,j5,j6,za,zb)*vv(st,j1,j2,j3,j4,j5,j6);\\n  a6_value = a6_value + switchyard(st,j1,j2,j3,j4,j5,j6,za,zb);   // @coverage-probe\\n\\n  return a6_value;\\n}\\n\\nextern \\\"C\\\" {\\n  std::complex<double> a6_wrapper(const char* st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                                  std::complex<double>* fza, std::complex<double>* fzb) {\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    return a6(st, j1, j2, j3, j4, j5, j6, za, zb);\\n  }\\n}\\n\"}"
