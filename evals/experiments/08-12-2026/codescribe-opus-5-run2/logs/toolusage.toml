args = "{\"path\": \"software/mcfm/src/W2jet/vv.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <W2jet.hpp>\\n#include <cmath>\\n#include <complex>\\n#include <constants_mod.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n#include <scale_mod.hpp>\\n#include <epinv_mod.hpp>\\n#include <epinv2_mod.hpp>\\n#include <Need.hpp>\\n\\nusing namespace constants_mod;\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\nusing namespace scale_mod;\\nusing namespace epinv_mod;\\nusing namespace epinv2_mod;\\n\\n//***********************************************************************\\n//     Author: R.K. Ellis                                               *\\n//     July, 1998.                                                      *\\n//***********************************************************************\\nstd::complex<double> vv(const char* st, int j1, int j2, int j3, int j4, int j5, int j6) {\\n  std::complex<double> vv_value;\\n  std::complex<double> xl12, xl34, xl23, xl56;\\n\\n  auto sel = [st](const char* w) { return st[0] == w[0] && st[1] == w[1]; };\\n\\n  xl12 = lnrat(musq,-s(j1,j2));\\n  xl34 = lnrat(musq,-s(j3,j4));\\n\\n  if (sel(\\\"pp\\\") || sel(\\\"pm\\\")) {\\n\\n    //  Vpm =Vpp=\\n    //    - 2*epinv^2   + epinv* ( 2/3 - xlog12 - xlog34 )\\n    //    + 10/9 - 1/2*xlog12^2 - 1/2*xlog34^2 + 13/6*xlog23 - 3/2*xlog56\\n    //  Vsl =\\n    //   -2*epinv^2 + epinv* ( - 3 - xlog12 - xlog34 )\\n    //   -15/2 - 3/2*xlog12 - 1/2*xlog12^2 - 3/2*xlog34 - 1/2*xlog34^2\\n\\n    xl23 = lnrat(musq,-s(j2,j3));\\n    xl56 = lnrat(musq,-s(j5,j6));\\n    vv_value = -epinv*(two*epinv2-two/three+xl12+xl34)\\n      +10.0/9.0-0.5*(std::pow(xl12, 2)+std::pow(xl34, 2))+13.0/6.0*xl23-1.5*xl56;\\n\\n  } else if (sel(\\\"sl\\\")) {\\n    vv_value =\\n      -epinv*(two*epinv2+three+xl12+xl34)\\n      -7.5-1.5*(xl12+xl34)-0.5*(std::pow(xl12, 2)+std::pow(xl34, 2));\\n\\n  }\\n\\n  std::complex<double> res = vv_value;   // @coverage-probe\\n  return res;\\n}\\n\\nextern \\\"C\\\" {\\n  std::complex<double> vv_wrapper(const char* st, int j1, int j2, int j3, int j4, int j5, int j6) {\\n    return vv(st, j1, j2, j3, j4, j5, j6);\\n  }\\n}\\n\"}"
