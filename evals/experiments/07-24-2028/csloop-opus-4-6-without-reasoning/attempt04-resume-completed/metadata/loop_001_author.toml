content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq.10.22\n#include <BDK.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstd::complex<double> FFPMscTtilde(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  double deltat14 = s(j1,j4) - s(j2,j3) - s(j5,j6);\n  double deltat56 = s(j5,j6) - s(j1,j4) - s(j2,j3);\n  double Deltat3 = pow(s(j1,j4),2) + pow(s(j2,j3),2) + pow(s(j5,j6),2)\n      - 2.0*s(j1,j4)*s(j2,j3) - 2.0*s(j2,j3)*s(j5,j6) - 2.0*s(j5,j6)*s(j1,j4);\n\n  std::complex<double> result =\n      3.0*za(j1,j4)*zb(j2,j3)*zab2(j2,j3,j4,j1)\n      /(zab2(j3,j1,j2,j4)*Deltat3*Deltat3)\n      *((deltat14*zab(j2,j5,j6) - s(j5,j6)*zab(j2,j3,j6))*zab(j5,j4,j1)\n      - 0.5*deltat56*zab(j2,j5,j6)*zab(j5,j6,j1))\n\n      - zab2(j2,j3,j4,j1)/(zab2(j3,j1,j2,j4)*Deltat3)\n      *(0.5*zab(j4,j5,j6)*(zab(j5,j6,j3) + 2.0*zab(j5,j2,j3))\n      - zab(j5,j2,j3)*zab(j4,j1,j6));\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> ffpmsctilde_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return FFPMscTtilde(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
