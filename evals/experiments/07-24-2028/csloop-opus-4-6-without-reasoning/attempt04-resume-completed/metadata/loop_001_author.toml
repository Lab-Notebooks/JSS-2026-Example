path = "software/mcfm/src/BDK/FFPMscT.cpp"
content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq10.21\n#include <BDK.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstd::complex<double> FFPMscT(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  // Statement functions as lambdas\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n  auto zba = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return zb(i1,i2)*za(i2,i3);\n  };\n  auto zb22b = [&](int i1, int i2, int i3, int i4, int i5, int i6) -> std::complex<double> {\n    return zb(i1,i2)*zab2(i2,i4,i5,i6) + zb(i1,i3)*zab2(i3,i4,i5,i6);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  double Delta3 = pow(s(j1,j2),2) + pow(s(j3,j4),2) + pow(s(j5,j6),2)\n      - 2.0*s(j1,j2)*s(j3,j4) - 2.0*s(j3,j4)*s(j5,j6) - 2.0*s(j5,j6)*s(j1,j2);\n  double delta12 = s(j1,j2) - s(j3,j4) - s(j5,j6);\n  double delta56 = s(j5,j6) - s(j1,j2) - s(j3,j4);\n\n  std::complex<double> result =\n      3.0*s(j1,j2)*zb(j4,j6)*za(j5,j6)*zab2(j4,j1,j2,j3)\n       /(zab2(j3,j1,j2,j4)*zab2(j1,j2,j3,j4)*Delta3*Delta3)\n      *(za(j1,j2)*zb(j5,j6)\n      *(zab(j5,j6,j1)*delta56 - zab(j5,j2,j1)*delta12)\n      + t(j1,j2,j4)*(zab(j2,j5,j6)*delta56 - zab(j2,j1,j6)*delta12))\n\n      + za(j1,j2)*zb(j4,j6)\n      /(zab2(j3,j1,j2,j4)*zab2(j1,j2,j3,j4)*Delta3)\n      *(-zb(j1,j2)*za(j5,j6)\n      *(3.0*zab2(j4,j1,j2,j3)*zab2(j2,j1,j3,j6)\n      - za(j2,j4)*zb(j3,j6)*(t(j1,j2,j3) - t(j1,j2,j4)))\n\n      + zab2(j4,j1,j2,j3)\n      *(zab(j5,j2,j1)*delta12 - zab(j5,j6,j1)*delta56\n      + t(j1,j2,j3)*zab2(j5,j2,j4,j1) - t(j1,j2,j4)*zab2(j5,j2,j3,j1))\n\n      + za(j4,j5)*t(j1,j2,j3)*(zb22b(j1,j3,j4,j1,j2,j3)\n      - zba(j1,j2,j4)*zb(j4,j3))\n      - zab2(j4,j1,j2,j3)*za(j3,j5)*t(j1,j2,j3)\n      *(zb22b(j1,j3,j4,j1,j2,j4) - zba(j1,j2,j3)*zb(j3,j4))\n      /zab2(j3,j1,j2,j4))\n\n      - zab(j2,j1,j3)*zab(j5,j4,j6)\n      /(zab2(j3,j1,j2,j4)*zab2(j1,j2,j3,j4))\n\n      + 3.0*zab(j1,j5,j6)*zab2(j4,j1,j2,j3)/(zab2(j1,j2,j3,j4)*Delta3*Delta3)\n      *(zab(j2,j1,j3)*(zab(j5,j2,j1)*delta12 - zab(j5,j6,j1)*delta56)\n      + zab(j1,j2,j3)*(zab(j5,j6,j2)*delta56 - zab(j5,j1,j2)*delta12)\n      *zab2(j2,j3,j4,j1)/zab2(j1,j3,j4,j2))\n\n      + za(j1,j5)/(zab2(j1,j2,j3,j4)*Delta3)\n      *(-zb(j1,j3)\n      *(zab(j2,j1,j3)*zab(j4,j5,j6) + zab(j4,j2,j3)*zab(j2,j5,j6)\n      - zab2(j4,j1,j2,j3)*(zab(j2,j1,j6) - zab(j2,j5,j6)))\n\n      + zb(j2,j3)*zab2(j2,j3,j4,j1)/zab2(j1,j3,j4,j2)\n      *(3.0*zab(j1,j5,j6)*zab(j4,j2,j3) - zab(j1,j2,j6)*zab2(j4,j1,j2,j3)\n      + zb(j2,j3)*za(j1,j4)*zab(j1,j5,j6)*(t(j2,j3,j4) - t(j1,j3,j4))\n      /zab2(j1,j3,j4,j2)));\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> ffpmscT_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return FFPMscT(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
