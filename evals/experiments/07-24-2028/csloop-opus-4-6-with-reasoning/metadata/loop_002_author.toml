content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n#include <W2jet.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <heldefs_mod.hpp>\n#include <W1jet.hpp>\n#include <Need.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\nusing namespace heldefs_mod;\n\nstd::complex<double> Fvf(int st, int j1, int j2, int j3, int j4, int j5, int j6,\n                         FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  // Statement function\n  auto zab2 = [&za, &zb](int k1, int k2, int k3, int k4) -> std::complex<double> {\n    return za(k1,k2)*zb(k2,k4)+za(k1,k3)*zb(k3,k4);\n  };\n\n  std::complex<double> I3m123456 = i3m(s(j1,j2), s(j3,j4), s(j5,j6));\n  std::complex<double> I3m563412 = I3m123456;\n\n  std::complex<double> result;\n\n  if (st == hqpqbmgpgm) {\n    result =\n      -std::pow(zab2(j5,j2,j4,j1),2)/(za(j5,j6)*zb(j1,j2)*std::pow(zab2(j3,j1,j2,j4),2))\n      *Lsm1_2mh(s(j3,j4),t(j1,j2,j4),s(j1,j2),s(j5,j6))\n      -std::pow(zab2(j2,j1,j3,j6),2)/(za(j1,j2)*zb(j5,j6)*std::pow(zab2(j3,j1,j2,j4),2))\n      *Lsm1_2mh(s(j3,j4),t(j1,j2,j3),s(j1,j2),s(j5,j6))\n\n      -I3m123456*za(j4,j5)*zb(j1,j3)\n      *zab2(j2,j1,j3,j6)/(2.0*zab2(j3,j1,j2,j4)*t(j1,j2,j3))\n\n      -I3m123456*za(j2,j4)*zb(j3,j6)\n      *zab2(j5,j2,j4,j1)/(2.0*zab2(j3,j1,j2,j4)*t(j1,j2,j4))\n\n      +I3m563412*za(j2,j4)*zb(j3,j6)\n      *zab2(j5,j3,j6,j1)/(2.0*zab2(j3,j1,j2,j4)*t(j3,j5,j6))\n\n      +I3m563412*za(j4,j5)*zb(j1,j3)\n      *zab2(j2,j4,j5,j6)/(2.0*zab2(j3,j1,j2,j4)*t(j4,j5,j6));\n\n  } else if (st == hqpqbmgpgp) {\n    result = -std::pow(za(j2,j5),2)/(za(j1,j2)*za(j5,j6)*std::pow(za(j3,j4),2))\n      *Lsm1_2me(t(j1,j2,j3),t(j1,j2,j4),s(j1,j2),s(j5,j6));\n  }\n\n  return result; // @coverage-probe\n}\n\nextern \"C\" {\n  std::complex<double> Fvf_wrapper(int st, int j1, int j2, int j3, int j4, int j5, int j6,\n                                   std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return Fvf(st, j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
