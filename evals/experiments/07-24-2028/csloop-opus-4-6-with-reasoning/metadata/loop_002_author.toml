content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n#include <W2jet.hpp>\n#include <complex>\n#include <cmath>\n#include <iostream>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <heldefs_mod.hpp>\n#include <W1jet.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\nusing namespace heldefs_mod;\n\nstd::complex<double> a6treeg(int st, int j1, int j2, int j3, int j4, int j5, int j6,\n                             FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  std::complex<double> result;\n\n  if (st == hqpgmgpqbm) {\n    result =\n      (za(j2,j4)*za(j4,j5)*zb(j1,j3)*zb(j1,j6))/\n      (s(j2,j3)*s(j5,j6)*za(j3,j4)*zb(j1,j2))\n      -(za(j4,j5)*std::pow(zb(j1,j3),2)*(-za(j1,j2)*zb(j1,j6)+za(j2,j3)*zb(j3,j6)))/\n      (s(j2,j3)*s(j5,j6)*zb(j1,j2)*t(j1,j2,j3))\n      +(std::pow(za(j2,j4),2)*zb(j1,j6)*(-za(j2,j5)*zb(j2,j3)+za(j4,j5)*zb(j3,j4)))/\n      (s(j2,j3)*s(j5,j6)*za(j3,j4)*t(j2,j3,j4));\n\n  } else if (st == hqpgpgmqbm) {\n    result =\n      -((za(j3,j5)*zb(j2,j3)+za(j4,j5)*zb(j2,j4))*\n      (-za(j1,j3)*zb(j1,j6)-za(j2,j3)*zb(j2,j6)))/\n      (s(j2,j3)*s(j5,j6)*za(j1,j2)*zb(j3,j4))\n      -(za(j1,j3)*za(j4,j5)*zb(j1,j2)*\n      (-za(j1,j3)*zb(j1,j6)-za(j2,j3)*zb(j2,j6)))/\n      (s(j2,j3)*s(j5,j6)*za(j1,j2)*t(j1,j2,j3))\n      +(za(j3,j4)*zb(j1,j6)*zb(j2,j4)*\n      (za(j3,j5)*zb(j2,j3)+za(j4,j5)*zb(j2,j4)))/\n      (s(j2,j3)*s(j5,j6)*zb(j3,j4)*t(j2,j3,j4));\n\n  } else if (st == hqpgpgpqbm) {\n    result =\n      (-std::pow(za(j4,j5),2))/(za(j1,j2)*za(j2,j3)*za(j3,j4)*za(j5,j6));\n\n  } else if (st == hqpgpqbmgm) {\n    result =\n      ((za(j3,j5)*zb(j1,j3)+za(j4,j5)*zb(j1,j4))*\n      (-za(j1,j3)*zb(j1,j6)-za(j2,j3)*zb(j2,j6)))/\n      (s(j5,j6)*za(j1,j2)*za(j2,j3)*zb(j1,j4)*zb(j3,j4))\n      +(za(j3,j5)*zb(j1,j2)*(-za(j1,j4)*zb(j1,j6)-za(j2,j4)*zb(j2,j6)))/\n      (s(j5,j6)*za(j1,j2)*zb(j1,j4)*t(j1,j2,j4))\n      -(za(j3,j4)*zb(j1,j6)*(za(j3,j5)*zb(j2,j3)+za(j4,j5)*zb(j2,j4)))/\n      (s(j5,j6)*za(j2,j3)*zb(j3,j4)*t(j2,j3,j4));\n\n  } else if (st == hqpgpqbmgp) {\n    result =\n      (-za(j1,j3)*std::pow(za(j3,j5),2))/\n      (za(j1,j2)*za(j1,j4)*za(j2,j3)*za(j3,j4)*za(j5,j6));\n\n  } else if (st == hqpqbmgmgp) {\n    result =\n      ((-za(j2,j5)*zb(j2,j4)-za(j3,j5)*zb(j3,j4))*\n      (-za(j1,j3)*zb(j1,j6)+za(j3,j4)*zb(j4,j6)))/\n      (s(j3,j4)*s(j5,j6)*za(j1,j4)*zb(j2,j3))\n      -(za(j1,j3)*za(j2,j5)*zb(j1,j4)*\n      (-za(j1,j3)*zb(j1,j6)+za(j3,j4)*zb(j4,j6)))/\n      (s(j3,j4)*s(j5,j6)*za(j1,j4)*t(j1,j3,j4))\n      -(za(j2,j3)*zb(j1,j6)*zb(j2,j4)*\n      (-za(j2,j5)*zb(j2,j4)-za(j3,j5)*zb(j3,j4)))/\n      (s(j3,j4)*s(j5,j6)*zb(j2,j3)*t(j2,j3,j4));\n\n  } else if (st == hqpqbmgpgm) {\n    result =\n      -(-(za(j2,j4)*za(j2,j5)*zb(j1,j3)*zb(j1,j6))/\n      (s(j3,j4)*s(j5,j6)*za(j2,j3)*zb(j1,j4))\n      +(za(j2,j5)*std::pow(zb(j1,j3),2)*(-za(j1,j4)*zb(j1,j6)-za(j3,j4)*zb(j3,j6)))/\n      (s(j3,j4)*s(j5,j6)*zb(j1,j4)*t(j1,j3,j4))\n      +(std::pow(za(j2,j4),2)*zb(j1,j6)*(-za(j2,j5)*zb(j2,j3)+za(j4,j5)*zb(j3,j4)))/\n      (s(j3,j4)*s(j5,j6)*za(j2,j3)*t(j2,j3,j4)));\n\n  } else if (st == hqpqbmgpgp) {\n    result =\n      (-std::pow(za(j2,j5),2))/(za(j1,j4)*za(j2,j3)*za(j3,j4)*za(j5,j6));\n\n  } else {\n    std::cout << \"unimplemented st \" << st << std::endl;\n    std::exit(1);\n  }\n\n  return result; // @coverage-probe\n}\n\nextern \"C\" {\n  std::complex<double> a6treeg_wrapper(int st, int j1, int j2, int j3, int j4, int j5, int j6,\n                                       std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return a6treeg(st, j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
