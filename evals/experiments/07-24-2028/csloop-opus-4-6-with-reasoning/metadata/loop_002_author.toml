content = "\nfunction atree(st,j1,j2,j3,j4,j5,j6,za,zb) result(res)\n  use, intrinsic :: iso_c_binding\n  use types\n  use mxpart_mod\n  use sprods_com_mod\n  implicit none\n\n  character(len=2), intent(in) :: st\n  integer(c_int), intent(in) :: j1, j2, j3, j4, j5, j6\n  complex(c_double_complex), intent(inout) :: za(mxpart,mxpart), zb(mxpart,mxpart)\n  complex(c_double_complex) :: res\n  integer(c_int) :: ist\n\n  interface\n    function atree_wrapper(ist,j1,j2,j3,j4,j5,j6,za,zb) bind(C, name=\"atree_wrapper\")\n      import :: c_int, c_double_complex, mxpart\n      integer(c_int), value :: ist, j1, j2, j3, j4, j5, j6\n      complex(c_double_complex) :: za(mxpart,mxpart), zb(mxpart,mxpart)\n      complex(c_double_complex) :: atree_wrapper\n    end function\n  end interface\n\n  ist = 0\n  if (st == 'pp') then\n    ist = 1\n  elseif (st == 'pm') then\n    ist = 2\n  elseif (st == 'sl') then\n    ist = 3\n  endif\n\n  res = atree_wrapper(ist,j1,j2,j3,j4,j5,j6,za,zb)\nend function atree\n"
