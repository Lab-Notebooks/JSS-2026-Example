                                       std::complex<double>* fza, std::complex<double>* fzb);\n  void subqcd_wrapper(int i1, int i2, int i3, int i4, int i5, int i6,\n                      std::complex<double>* fza, std::complex<double>* fzb,\n                      std::complex<double>* famp);\n  std::complex<double> Fvf_wrapper(int st, int j1, int j2, int j3, int j4, int j5, int j6,\n                                   std::complex<double>* fza, std::complex<double>* fzb);\n  void ZZbox1LL_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n                        std::complex<double>* fza, std::complex<double>* fzb,\n                        double mt,\n                        std::complex<double>* fXpp, std::complex<double>* fXmp,\n                        std::complex<double>* fXpm, std::complex<double>* fXmm,\n                        std::complex<double>* fXrat);\n}\n\n#endif\n"
