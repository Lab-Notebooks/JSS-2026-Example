content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n#include <W2jet.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <W1jet.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\n// st encoding: 1=pp, 2=pm, 3=sl\nstd::complex<double> atree(int ist, int j1, int j2, int j3, int j4, int j5, int j6,\n                           FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  // Statement function: tree (BDKW Eq.(3.10))\n  auto tree = [&za, &zb](int i1, int i2, int i3, int i4, int i5, int i6) -> std::complex<double> {\n    return +zb(i1,i2)*za(i5,i4)*(za(i3,i1)*zb(i1,i6)+za(i3,i2)*zb(i2,i6))\n           /(s(i2,i3)*s(i5,i6)*t(i1,i2,i3))\n           +za(i3,i4)*zb(i6,i1)*(za(i5,i3)*zb(i3,i2)+za(i5,i4)*zb(i4,i2))\n           /(s(i2,i3)*s(i5,i6)*t(i2,i3,i4));\n  };\n\n  std::complex<double> result;\n  if (ist == 1) { // pp\n    result = +tree(j1,j2,j3,j4,j5,j6);\n  } else if (ist == 2) { // pm\n    result = -tree(j1,j3,j2,j4,j5,j6);\n  } else if (ist == 3) { // sl\n    result = -tree(j3,j1,j2,j4,j5,j6);\n  }\n\n  return result; // @coverage-probe\n}\n\nextern \"C\" {\n  std::complex<double> atree_wrapper(int ist, int j1, int j2, int j3, int j4, int j5, int j6,\n                                     std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return atree(ist, j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
