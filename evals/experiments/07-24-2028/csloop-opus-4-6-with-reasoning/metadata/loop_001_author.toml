content = "\"\"\"Generate C++ translations for Group 1 Mods files.\"\"\"\nimport re, os\n\nSRC = 'software/mcfm/src/Mods'\n\n# ---------- types_mod.hpp ----------\nwith open(os.path.join(SRC, 'types_mod.hpp'), 'w') as f:\n    f.write(\"\"\"\\\n#ifndef TYPES_MOD_HPP\n#define TYPES_MOD_HPP\n\n// Fortran kind parameters mapped to C++ types:\n//   sp = selected_real_kind(6)  -> float\n//   dp = selected_real_kind(15) -> double\n//   ex = selected_real_kind(18) -> long double\n//   qp = selected_real_kind(33) -> __float128 (platform-dependent)\n\n#endif\n\"\"\")\nprint(\"wrote types_mod.hpp\")\n\n# ---------- mod_qcdloop_c.hpp ----------\nwith open(os.path.join(SRC, 'mod_qcdloop_c.hpp'), 'w') as f:\n    f.write(\"\"\"\\\n#ifndef MOD_QCDLOOP_C_HPP\n#define MOD_QCDLOOP_C_HPP\n\n#include <complex>\n\n// C++ declarations for QCDLoop C library functions.\n// The Fortran module mod_qcdloop_c provides the same interface via\n// bind(C) interface blocks.\n\nextern \"C\" {\n\nvoid qlcachesize(const int* csize);\n\nstd::complex<double> cln(const std::complex<double>* x, const double* isig);\n\nbool qlzero(const double* x);\nbool qlnonzero(const double* x);\n\nstd::complex<double> qli1(const double* m1, const double* mu2, const int* ep);\nstd::complex<double> qli1c(std::complex<double>* m1, const double* mu2, const int* ep);\n\nstd::complex<double> qli2(const double* p1, const double* m1, const double* m2,\n                           const double* mu2, const int* ep);\nstd::complex<double> qli2c(const double* p1, std::complex<double>* m1,\n                            std::complex<double>* m2, const double* mu2, const int* ep);\nstd::complex<double> qli2p(const double* p1, const double* m1, const double* m2,\n                            const double* mu2, const int* ep);\nstd::complex<double> qli2pc(const double* p1, std::complex<double>* m1,\n                             std::complex<double>* m2, const double* mu2, const int* ep);\n\nstd::complex<double> qli3(const double* p1, const double* p2, const double* p3,\n                           const double* m1, const double* m2, const double* m3,\n                           const double* mu2, const int* ep);\nstd::complex<double> qli3c(const double* p1, const double* p2, const double* p3,\n                            std::complex<double>* m1, std::complex<double>* m2,\n                            std::complex<double>* m3, const double* mu2, const int* ep);\n\nstd::complex<double> qli4(const double* p1, const double* p2, const double* p3,\n                           const double* p4, const double* s12, const double* s23,\n                           const double* m1, const double* m2, const double* m3,\n                           const double* m4, const double* mu2, const int* ep);\nstd::complex<double> qli4c(const double* p1, const double* p2, const double* p3,\n                            const double* p4, const double* s12, const double* s23,\n                            const double* mu2,\n                            const std::complex<double>* m1, const std::complex<double>* m2,\n                            const std::complex<double>* m3, const std::complex<double>* m4,\n                            const int* ep);\n\n} // extern \"C\"\n\n#endif\n\"\"\")\nprint(\"wrote mod_qcdloop_c.hpp\")\n\n# ---------- Modules_Interface.hpp ----------\nwith open(os.path.join(SRC, 'Modules_Interface.hpp'), 'w') as f:\n    f.write(\"\"\"\\\n#ifndef MODULES_INTERFACE_HPP\n#define MODULES_INTERFACE_HPP\n\n// C++ declarations for the Fortran module-initialisation bridge.\n// The implementation lives in Modules_Interface.f90 (bind(C) subroutines).\n\nextern \"C\" {\n  void modules_fi_init_();\n  void modules_fi_finalize_();\n}\n\n#endif\n\"\"\")\nprint(\"wrote Modules_Interface.hpp\")\n\n# ---------- pp_mod helper: read values ----------\ndef read_pp_values(path):\n    with open(path) as f:\n        text = f.read()\n    match = re.search(r'reshape\\(\\(/(.+?)/\\)', text, re.DOTALL)\n    data = match.group(1)\n    return re.findall(r'-?\\d+', data)\n\ndef format_array(values, per_line=27):\n    lines = []\n    for i in range(0, len(values), per_line):\n        chunk = values[i:i+per_line]\n        lines.append(', '.join(chunk))\n    return ',\\n'.join(lines)\n\n# ---------- pp_mod.hpp ----------\nwith open(os.path.join(SRC, 'pp_mod.hpp'), 'w') as f:\n    f.write(\"\"\"\\\n#ifndef PP_MOD_HPP\n#define PP_MOD_HPP\n\n#include <ppmax_mod.hpp>\n\nnamespace pp_mod {\n  using namespace ppmax_mod;\n  // pp(-4:4, -4:4, -4:4, -4:4) — 9^4 = 6561 ints, column-major\n  extern int pp_data[6561];\n}\n\n#endif\n\"\"\")\nprint(\"wrote pp_mod.hpp\")\n\n# ---------- pp_mod.cpp ----------\npp_vals = read_pp_values(os.path.join(SRC, 'pp_mod.f90'))\nassert len(pp_vals) == 6561, f\"Expected 6561 values, got {len(pp_vals)}\"\nwith open(os.path.join(SRC, 'pp_mod.cpp'), 'w') as f:\n    f.write('#include <pp_mod.hpp>\\n\\n')\n    f.write('namespace pp_mod {\\n')\n    f.write('  int pp_data[6561] = {\\n')\n    f.write(format_array(pp_vals))\n    f.write('\\n  };\\n')\n    f.write('}\\n\\n')\n    f.write('extern \"C\" {\\n')\n    f.write('  int* pp_mod_pp() { return pp_mod::pp_data; }\\n')\n    f.write('}\\n')\nprint(\"wrote pp_mod.cpp\")\n\n# ---------- ppwp2j_mod.hpp ----------\nwith open(os.path.join(SRC, 'ppwp2j_mod.hpp'), 'w') as f:\n    f.write(\"\"\"\\\n#ifndef PPWP2J_MOD_HPP\n#define PPWP2J_MOD_HPP\n\n#include <ppmax_mod.hpp>\n\nnamespace ppwp2j_mod {\n  using namespace ppmax_mod;\n  // pp(-4:4, -4:4, -4:4, -4:4) — 9^4 = 6561 ints, column-major\n  extern int pp_data[6561];\n}\n\n#endif\n\"\"\")\nprint(\"wrote ppwp2j_mod.hpp\")\n\n# ---------- ppwp2j_mod.cpp ----------\nppwp2j_vals = read_pp_values(os.path.join(SRC, 'ppwp2j_mod.f90'))\nassert len(ppwp2j_vals) == 6561, f\"Expected 6561 values, got {len(ppwp2j_vals)}\"\nwith open(os.path.join(SRC, 'ppwp2j_mod.cpp'), 'w') as f:\n    f.write('#include <ppwp2j_mod.hpp>\\n\\n')\n    f.write('namespace ppwp2j_mod {\\n')\n    f.write('  int pp_data[6561] = {\\n')\n    f.write(format_array(ppwp2j_vals))\n    f.write('\\n  };\\n')\n    f.write('}\\n\\n')\n    f.write('extern \"C\" {\\n')\n    f.write('  int* ppwp2j_mod_pp() { return ppwp2j_mod::pp_data; }\\n')\n    f.write('}\\n')\nprint(\"wrote ppwp2j_mod.cpp\")\n\nprint(\"\\nAll Group 1 files generated.\")\n"
