content = "import re, sys\n\ndef extract_values(path):\n    with open(path) as f:\n        text = f.read()\n    match = re.search(r'reshape\\(\\(/(.+?)/\\)', text, re.DOTALL)\n    data = match.group(1)\n    values = re.findall(r'-?\\d+', data)\n    return values\n\ndef format_cpp(values, varname):\n    lines = []\n    line = \"\"\n    for i, v in enumerate(values):\n        if i > 0:\n            line += \", \"\n        if len(line) > 90:\n            lines.append(line)\n            line = \"\"\n        line += v\n    if line:\n        lines.append(line)\n    return lines\n\npp_vals = extract_values('software/mcfm/src/Mods/pp_mod.f90')\nppwp2j_vals = extract_values('software/mcfm/src/Mods/ppwp2j_mod.f90')\n\nprint(f\"pp_mod values: {len(pp_vals)}\")\nprint(f\"ppwp2j_mod values: {len(ppwp2j_vals)}\")\n\nwith open('dev/tmp/pp_mod_values.txt', 'w') as f:\n    for line in format_cpp(pp_vals, 'pp'):\n        f.write(line + '\\n')\n\nwith open('dev/tmp/ppwp2j_mod_values.txt', 'w') as f:\n    for line in format_cpp(ppwp2j_vals, 'ppwp2j'):\n        f.write(line + '\\n')\n\nprint(\"wrote dev/tmp/pp_mod_values.txt and dev/tmp/ppwp2j_mod_values.txt\")\n"
