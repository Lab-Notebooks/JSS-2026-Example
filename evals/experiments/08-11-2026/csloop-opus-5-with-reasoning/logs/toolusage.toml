args = "{\"path\": \"software/mcfm/src/W2jet/fvf.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n\\n#include \\\"fvf.hpp\\\"\\n\\n#include <FArray.hpp>\\n#include <cmath>\\n#include <complex>\\n#include <Need.hpp>\\n#include <W1jet.hpp>\\n#include <heldefs_mod.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n\\nusing namespace heldefs_mod;\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\n\\nstd::complex<double> Fvf(int st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                         FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\\n  std::complex<double> Fvf_res(0.0, 0.0);\\n  std::complex<double> I3m123456, I3m563412;\\n\\n  //---statement function\\n  auto zab2 = [&za, &zb](int i1, int i2, int i3, int i4) {\\n    return za(i1,i2)*zb(i2,i4)+za(i1,i3)*zb(i3,i4);\\n  };\\n\\n  I3m123456 = i3m(s(j1,j2),s(j3,j4),s(j5,j6));\\n  I3m563412 = I3m123456;\\n\\n  if (st == hqpqbmgpgm) {\\n    Fvf_res =\\n      -std::pow(zab2(j5,j2,j4,j1),2)/(za(j5,j6)*zb(j1,j2)*std::pow(zab2(j3,j1,j2,j4),2))\\n      *Lsm1_2mh(s(j3,j4),t(j1,j2,j4),s(j1,j2),s(j5,j6))\\n      -std::pow(zab2(j2,j1,j3,j6),2)/(za(j1,j2)*zb(j5,j6)*std::pow(zab2(j3,j1,j2,j4),2))\\n      *Lsm1_2mh(s(j3,j4),t(j1,j2,j3),s(j1,j2),s(j5,j6))\\n\\n      -I3m123456*za(j4,j5)*zb(j1,j3)\\n      *zab2(j2,j1,j3,j6)/(2.0*zab2(j3,j1,j2,j4)*t(j1,j2,j3))\\n\\n      -I3m123456*za(j2,j4)*zb(j3,j6)\\n      *zab2(j5,j2,j4,j1)/(2.0*zab2(j3,j1,j2,j4)*t(j1,j2,j4))\\n\\n      +I3m563412*za(j2,j4)*zb(j3,j6)\\n      *zab2(j5,j3,j6,j1)/(2.0*zab2(j3,j1,j2,j4)*t(j3,j5,j6))\\n\\n      +I3m563412*za(j4,j5)*zb(j1,j3)\\n      *zab2(j2,j4,j5,j6)/(2.0*zab2(j3,j1,j2,j4)*t(j4,j5,j6)); // @coverage-probe\\n  } else if (st == hqpqbmgpgp) {\\n    Fvf_res = -std::pow(za(j2,j5),2)/(za(j1,j2)*za(j5,j6)*std::pow(za(j3,j4),2))\\n      *Lsm1_2me(t(j1,j2,j3),t(j1,j2,j4),s(j1,j2),s(j5,j6));\\n  }\\n  return Fvf_res;\\n}\\n\\nextern \\\"C\\\" {\\n  std::complex<double> fvf_wrapper(int st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                                   std::complex<double>* fza, std::complex<double>* fzb) {\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    return Fvf(st, j1, j2, j3, j4, j5, j6, za, zb);\\n  }\\n}\\n\"}"
