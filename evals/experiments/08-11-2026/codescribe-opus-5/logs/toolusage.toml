 * (xl12 + xl34) - 0.5 * (std::pow(xl12, 2) + std::pow(xl34, 2));\\n  }\\n\\n  return vv_result;\\n}\\n\\nextern \\\"C\\\" {\\nstd::complex<double> vv_wrapper(const char* st, int j1, int j2, int j3, int j4,\\n                                int j5, int j6) {\\n  return vv(std::string(st, 2), j1, j2, j3, j4, j5, j6);\\n}\\n}\\n\"}"
