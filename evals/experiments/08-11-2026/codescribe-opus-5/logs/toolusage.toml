args = "{\"path\": \"software/mcfm/src/W2jet/Acalc.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include \\\"Acalc.hpp\\\"\\n\\n#include <cmath>\\n#include <complex>\\n#include <FArray.hpp>\\n#include <ZZclabels_mod.hpp>\\n#include <ZZdlabels_mod.hpp>\\n#include <constants_mod.hpp>\\n#include <ggZZintegrals_mod.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n\\nusing namespace constants_mod;\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\nusing namespace ZZclabels_mod;\\nusing namespace ZZdlabels_mod;\\nusing namespace ggZZintegrals_mod;\\n\\nvoid Acalc(int k1, int k2, int k3, int k4, int k5, int k6, double& mt,\\n           FArray1D<std::complex<double>>& A) {\\n  double mtsq, s12, s134, s234, s134bar, s234bar, p3sq, Y;\\n\\n  mtsq = std::pow(mt, 2);\\n  s12 = s(k1, k2);\\n  s134bar = s(k1, k3) + s(k1, k4);\\n  s234bar = s(k2, k3) + s(k2, k4);\\n  p3sq = s(k3, k4);\\n  s234 = s234bar + p3sq;\\n  s134 = s134bar + p3sq;\\n  Y = s134bar * s234bar - s12 * p3sq;\\n\\n  A(1) = +half * mtsq / s12 * (+two * C0(c1_34) * s134bar + two * C0(c2_56) * (-s234bar - s12) + two * C0(c2_34) * s234bar + two * C0(c1_56) * (-s12 - s134bar) - two * Y * D0(d1_34_2) + s12 * (s12 - 4 * mtsq) * (D0(d1_2_34) + D0(d2_1_34) + D0(d1_34_2)));  // @coverage-probe\\n\\n  A(2) = two * mtsq * (D0(d6_1_2_34) + D0(d6_2_1_34) + C0(c12_34) + mtsq * (D0(d1_2_34) + D0(d2_1_34) - D0(d1_34_2)));\\n\\n  A(3) = half * mtsq * s12 * (D0(d1_2_34) - D0(d2_1_34) - D0(d1_34_2));\\n  A(4) = half * mtsq * s12 * (D0(d2_1_34) - D0(d1_2_34) - D0(d1_34_2));\\n\\n  A(5) = half * mtsq * s12 / (s134 * s234) * (+two * s134 * D0(d6_1_2_34) + two * s234 * D0(d6_2_1_34) - s134 * s234 * D0(d1_34_2) + four * mtsq * (s134 * D0(d1_2_34) + s234 * D0(d2_1_34)) + two * (s234 + s134) * C0(c12_34));\\n\\n  A(6) = czip;\\n\\n  return;\\n}\\n\\nextern \\\"C\\\" {\\nvoid Acalc_wrapper(int k1, int k2, int k3, int k4, int k5, int k6, double* mt,\\n                   std::complex<double>* fA) {\\n  FArray1D<std::complex<double>> A(fA, 6);\\n  Acalc(k1, k2, k3, k4, k5, k6, *mt, A);\\n}\\n}\\n\"}"
