i6) * zba2(i5, i2, i6, i3) / za(i1, i5) / zb(i2, i6) - za(i1, i6) * za(i2, i3) * zb(i1, i5) * zba2(i4, i1, i5, i6) / za(i1, i5) / s156 - za(i2, i6) * zb(i1, i4) * zb(i2, i5) * zba2(i5, i2, i6, i3) / zb(i2, i6) / s256);\\n  amp(-1, +1) = four / (s(i3, i4) * s(i5, i6)) * (za(i2, i3) * za(i2, i5) * zb(i1, i4) * zb(i1, i6) / za(i2, i6) / zb(i1, i5) - za(i2, i3) * std::pow(zb(i1, i6), 2) * zba2(i4, i1, i6, i5) / zb(i1, i5) / s156 - std::pow(za(i2, i5), 2) * zb(i1, i4) * zba2(i6, i2, i5, i3) / za(i2, i6) / s256);\\n\\n  return;\\n}\\n\\nextern \\\"C\\\" {\\nvoid subqcd_wrapper(int i1, int i2, int i3, int i4, int i5, int i6,\\n                    std::complex<double>* fza, std::complex<double>* fzb,\\n                    std::complex<double>* famp) {\\n  FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n  FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n  FArray2D<std::complex<double>> amp(famp, 3, 3, -1, -1);\\n  subqcd(i1, i2, i3, i4, i5, i6, za, zb, amp);\\n}\\n}\\n\"}"
