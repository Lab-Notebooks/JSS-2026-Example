args = "{\"path\": \"software/mcfm/src/W2jet/atree.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include \\\"atree.hpp\\\"\\n\\n#include <complex>\\n#include <string>\\n#include <FArray.hpp>\\n#include <W1jet.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\n\\n//***********************************************************************\\n//     Author: R.K. Ellis                                               *\\n//     July, 1998.                                                      *\\n//***********************************************************************\\n//---- the basic process is atreepp which is the amplitude for\\n//---- q-(p4)+Q(-p2)+l-(-p5) ---> q+(p1)+Q-(p3)+l+(p6)\\n//---- All outgoing particles are right-handed,\\n//---- except Q(p3) which is left-handed\\nstd::complex<double> atree(const std::string& st, int j1, int j2, int j3,\\n                           int j4, int j5, int j6,\\n                           FArray2D<std::complex<double>>& za,\\n                           FArray2D<std::complex<double>>& zb) {\\n  std::complex<double> atree_result(0.0, 0.0);\\n\\n  //-----Note all tree amplitudes divided by im wrt to BDKW paper\\n  //-----Statement function for pp (others derived by crossing)\\n  //-----This is an implementation of BDKW Eq.(3.10)\\n  auto tree = [&za, &zb](int k1, int k2, int k3, int k4, int k5, int k6) {\\n    return +zb(k1, k2) * za(k5, k4) *\\n               (za(k3, k1) * zb(k1, k6) + za(k3, k2) * zb(k2, k6)) /\\n               (s(k2, k3) * s(k5, k6) * t(k1, k2, k3)) +\\n           za(k3, k4) * zb(k6, k1) *\\n               (za(k5, k3) * zb(k3, k2) + za(k5, k4) * zb(k4, k2)) /\\n               (s(k2, k3) * s(k5, k6) * t(k2, k3, k4));\\n  };\\n\\n  if (st == \\\"pp\\\") {\\n    atree_result = +tree(j1, j2, j3, j4, j5, j6);  // @coverage-probe\\n  } else if (st == \\\"pm\\\") {\\n    atree_result = -tree(j1, j3, j2, j4, j5, j6);\\n  } else if (st == \\\"sl\\\") {\\n    //---this is not a real tree amplitude but it is an auxiliary quantity.\\n    atree_result = -tree(j3, j1, j2, j4, j5, j6);\\n  }\\n\\n  return atree_result;\\n}\\n\\nextern \\\"C\\\" {\\nstd::complex<double> atree_wrapper(const char* st, int j1, int j2, int j3,\\n                                   int j4, int j5, int j6,\\n                                   std::complex<double>* fza,\\n                                   std::complex<double>* fzb) {\\n  FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n  FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n  return atree(std::string(st, 2), j1, j2, j3, j4, j5, j6, za, zb);\\n}\\n}\\n\"}"
