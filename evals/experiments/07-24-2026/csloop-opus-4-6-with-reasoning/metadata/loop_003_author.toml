content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n#include <W2jet.hpp>\n#include <Need.hpp>\n#include <W1jet.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstd::complex<double> fpp(int j1, int j2, int j3, int j4, int j5, int j6,\n                         FArray2D<std::complex<double>>& za,\n                         FArray2D<std::complex<double>>& zb) {\n\n  std::complex<double> t0, s1, s2, s3;\n\n  s2 = -2.0*(-za(j1,j3)*zb(j1,j6)-za(j2,j3)*zb(j2,j6))\n    /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))/zb(j5,j6)\n    *(L0(-s(j2,j3),-t(j1,j2,j3))*zb(j1,j2)\n      *(za(j1,j2)*zb(j2,j6)+za(j1,j3)*zb(j3,j6))\n      /pow(t(j1,j2,j3),2)\n     +L0(-s(j5,j6),-t(j1,j2,j3))/za(j2,j3)*za(j3,j4)*zb(j4,j6)\n      /t(j1,j2,j3));\n\n  s3 = (Lsm1(-s(j1,j2),-t(j1,j2,j3),-s(j2,j3),-t(j1,j2,j3))\n       +Lsm1_2mht(s(j3,j4),t(j1,j2,j3),s(j1,j2),s(j5,j6)))\n    *(-pow(za(j4,j5),2)/za(j5,j6)\n      *pow(zb(j1,j2),2)/(za(j2,j4)*zb(j1,j2)+za(j3,j4)*zb(j1,j3))\n      /zb(j2,j3)/t(j1,j2,j3)\n     +1.0/za(j2,j3)*pow(-za(j1,j3)*zb(j1,j6)-za(j2,j3)*zb(j2,j6),2)\n      /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n      /zb(j5,j6)/t(j1,j2,j3))\n    -1.0/za(j2,j3)/(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n    *(L1(-t(j1,j2,j3),-s(j2,j3))/pow(s(j2,j3),2)\n      *pow(za(j2,j3),2)*pow(zb(j1,j2),2)\n      *pow(za(j1,j2)*zb(j2,j6)+za(j1,j3)*zb(j3,j6),2)\n     +L1(-s(j5,j6),-t(j1,j2,j3))\n      *pow(za(j3,j4),2)*pow(zb(j4,j6),2))\n    /zb(j5,j6)/t(j1,j2,j3)/2.0;\n\n  s1 = s2 + s3;\n\n  s2 = s1-2.0/za(j5,j6)\n    *(za(j3,j5)*zb(j2,j3)+za(j4,j5)*zb(j2,j4))\n    /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n    *(-L0(-s(j2,j3),-t(j2,j3,j4))*za(j3,j4)\n      *(-za(j2,j5)*zb(j2,j4)-za(j3,j5)*zb(j3,j4))\n      /pow(t(j2,j3,j4),2)\n     +L0(-s(j5,j6),-t(j2,j3,j4))*za(j1,j5)*zb(j1,j2)\n      /zb(j2,j3)/t(j2,j3,j4));\n\n  t0 = s2\n    -(Lsm1(-s(j3,j4),-t(j2,j3,j4),-s(j2,j3),-t(j2,j3,j4))\n     +Lsm1_2mht(s(j1,j2),t(j2,j3,j4),s(j3,j4),s(j5,j6)))\n    *(1.0/za(j5,j6)/zb(j2,j3)\n      *pow(za(j3,j5)*zb(j2,j3)+za(j4,j5)*zb(j2,j4),2)\n      /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n      /t(j2,j3,j4)\n     -1.0/za(j2,j3)*pow(za(j3,j4),2)\n      /(za(j2,j4)*zb(j1,j2)+za(j3,j4)*zb(j1,j3))\n      *pow(zb(j1,j6),2)/zb(j5,j6)/t(j2,j3,j4))\n    +1.0/za(j5,j6)/zb(j2,j3)\n    /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n    *(L1(-s(j5,j6),-t(j2,j3,j4))*pow(za(j1,j5),2)*pow(zb(j1,j2),2)\n     +L1(-t(j2,j3,j4),-s(j2,j3))/pow(s(j2,j3),2)\n      *pow(za(j3,j4),2)*pow(zb(j2,j3),2)\n      *pow(-za(j2,j5)*zb(j2,j4)-za(j3,j5)*zb(j3,j4),2))\n    /t(j2,j3,j4)/2.0;\n\n  return t0; // @coverage-probe\n}\n\nextern \"C\" {\n  std::complex<double> fpp_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n                                   std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return fpp(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
