content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n#include <W2jet.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <cstdlib>\n#include <iostream>\n#include <constants_mod.hpp>\n#include <nf_mod.hpp>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <scale_mod.hpp>\n#include <masses_mod.hpp>\n#include <epinv_mod.hpp>\n#include <toploops_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace constants_mod;\nusing namespace nf_mod;\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\nusing namespace scale_mod;\nusing namespace masses_mod;\nusing namespace epinv_mod;\nusing namespace toploops_mod;\n\n// A6texact is still Fortran — call via mangled symbol\nextern \"C\" {\n  std::complex<double> a6texact_(double* s23, double* mt2);\n}\n\nvoid a6routine(int ist, int j1, int j2, int j3, int j4, int j5, int j6,\n               FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb,\n               std::complex<double>& a6sf, std::complex<double>& a6tp,\n               std::complex<double>& a6uv) {\n\n  if (ist == 3) { // sl\n    std::cout << \"error in a6routine: st=sl\" << std::endl;\n    std::exit(1);\n  }\n\n  std::complex<double> tree = atree(ist, j1, j2, j3, j4, j5, j6, za, zb);\n\n  std::complex<double> virttp = czip;\n\n  if (toplight) {\n    if (toploops == tapprox) {\n      if (mt != 0.0) {\n        virttp = -2.0/15.0 * s(j2, j3) / pow(mt, 2);\n      } else {\n        std::cerr << \"mt=0 in a6routine\" << std::endl;\n        std::exit(1);\n      }\n    } else if (toploops == texact) {\n      double s23_val = s(j2, j3);\n      double mt2_val = pow(mt, 2);\n      virttp = a6texact_(&s23_val, &mt2_val);\n    } else if (toploops == tnone) {\n      virttp = czip;\n    }\n  } else {\n    virttp = czip;\n  }\n\n  std::complex<double> virtsf = two/three * epinv\n    + two/three * lnrat(musq, -s(j2, j3)) + 10.0/9.0;\n\n  std::complex<double> virtuv = (epinv * (11.0 - two/xn * static_cast<double>(nf)) - one) / three;\n\n  a6sf = tree * virtsf; // @coverage-probe\n  a6tp = tree * virttp;\n  a6uv = tree * virtuv;\n}\n\nextern \"C\" {\n  void a6routine_wrapper(int ist, int j1, int j2, int j3, int j4, int j5, int j6,\n                         std::complex<double>* fza, std::complex<double>* fzb,\n                         std::complex<double>* a6sf, std::complex<double>* a6tp,\n                         std::complex<double>* a6uv) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    a6routine(ist, j1, j2, j3, j4, j5, j6, za, zb, *a6sf, *a6tp, *a6uv);\n  }\n}\n"
