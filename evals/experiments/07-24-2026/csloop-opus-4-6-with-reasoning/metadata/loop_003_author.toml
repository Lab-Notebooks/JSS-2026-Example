content = "\nsubroutine a6routine(st, j1, j2, j3, j4, j5, j6, za, zb, a6sf, a6tp, a6uv)\n  use, intrinsic :: iso_c_binding\n  use types\n  use mxpart_mod\n  implicit none\n\n  character(len=2), intent(in) :: st\n  integer(c_int), intent(in) :: j1, j2, j3, j4, j5, j6\n  complex(c_double_complex), intent(inout) :: za(mxpart,mxpart), zb(mxpart,mxpart)\n  complex(c_double_complex), intent(out) :: a6sf, a6tp, a6uv\n  integer(c_int) :: ist\n\n  interface\n    subroutine a6routine_wrapper(ist, j1, j2, j3, j4, j5, j6, &\n         za, zb, a6sf, a6tp, a6uv) &\n      bind(C, name=\"a6routine_wrapper\")\n      import :: c_int, c_double_complex, mxpart\n      integer(c_int), value :: ist, j1, j2, j3, j4, j5, j6\n      complex(c_double_complex) :: za(mxpart,mxpart), zb(mxpart,mxpart)\n      complex(c_double_complex) :: a6sf, a6tp, a6uv\n    end subroutine\n  end interface\n\n  ist = 0\n  if (st == 'pp') then\n    ist = 1\n  elseif (st == 'pm') then\n    ist = 2\n  elseif (st == 'sl') then\n    ist = 3\n  endif\n\n  call a6routine_wrapper(ist, j1, j2, j3, j4, j5, j6, za, zb, a6sf, a6tp, a6uv)\nend subroutine a6routine\n"
