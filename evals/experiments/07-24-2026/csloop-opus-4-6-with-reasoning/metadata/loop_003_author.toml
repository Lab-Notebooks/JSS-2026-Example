content = "\nfunction fpp(j1, j2, j3, j4, j5, j6, za, zb) result(res)\n  use, intrinsic :: iso_c_binding\n  use types\n  use mxpart_mod\n  implicit none\n\n  integer(c_int), intent(in) :: j1, j2, j3, j4, j5, j6\n  complex(c_double_complex), intent(inout) :: za(mxpart,mxpart), zb(mxpart,mxpart)\n  complex(c_double_complex) :: res\n\n  interface\n    function fpp_wrapper(j1, j2, j3, j4, j5, j6, za, zb) &\n      bind(C, name=\"fpp_wrapper\")\n      import :: c_int, c_double_complex, mxpart\n      integer(c_int), value :: j1, j2, j3, j4, j5, j6\n      complex(c_double_complex) :: za(mxpart,mxpart), zb(mxpart,mxpart)\n      complex(c_double_complex) :: fpp_wrapper\n    end function\n  end interface\n\n  res = fpp_wrapper(j1, j2, j3, j4, j5, j6, za, zb)\nend function fpp\n"
