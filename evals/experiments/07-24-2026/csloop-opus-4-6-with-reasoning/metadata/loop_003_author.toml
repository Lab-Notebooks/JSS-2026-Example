content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n#include <W2jet.hpp>\n#include <Need.hpp>\n#include <W1jet.hpp>\n#include <complex>\n#include <cmath>\n#include <constants_mod.hpp>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace constants_mod;\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstd::complex<double> fpm(int j1, int j2, int j3, int j4, int j5, int j6,\n                         FArray2D<std::complex<double>>& za,\n                         FArray2D<std::complex<double>>& zb) {\n\n  std::complex<double> t0, s1, s2, s3, s4, s5, s6, s7, s8, s9, s10,\n    s11, s12, s13, s14, s15, s16, s17, s18;\n\n  s3 = -2.0*L0(-t(j2,j3,j4),-s(j5,j6))/s(j5,j6)*za(j1,j5)/za(j5,j6)\n    *zb(j1,j3)/zb(j2,j3)/(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n    *(-za(j2,j5)*zb(j2,j3)+za(j4,j5)*zb(j3,j4))\n    -2.0*L0(-t(j1,j2,j3),-s(j5,j6))/s(j5,j6)/za(j2,j3)*za(j2,j4)\n    /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n    *(-za(j1,j2)*zb(j1,j6)+za(j2,j3)*zb(j3,j6))*zb(j4,j6)/zb(j5,j6);\n\n  s4 = s3+Lsm1(-s(j1,j2),-t(j1,j2,j3),-s(j2,j3),-t(j1,j2,j3))\n    *(-pow(za(j4,j5),2)/za(j5,j6)*pow(zb(j1,j3),2)\n      /(za(j2,j4)*zb(j1,j2)+za(j3,j4)*zb(j1,j3))\n      /zb(j2,j3)/t(j1,j2,j3)\n     +pow(za(j1,j2),2)/pow(za(j1,j3),2)/za(j2,j3)\n      *pow(-za(j1,j3)*zb(j1,j6)-za(j2,j3)*zb(j2,j6),2)\n      /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n      /zb(j5,j6)/t(j1,j2,j3));\n\n  s2 = s4+Lsm1_2mh(s(j3,j4),t(j1,j2,j3),s(j1,j2),s(j5,j6))\n    *(-pow(za(j4,j5),2)/za(j5,j6)*pow(zb(j1,j3),2)\n      /(za(j2,j4)*zb(j1,j2)+za(j3,j4)*zb(j1,j3))\n      /zb(j2,j3)/t(j1,j2,j3)\n     +1.0/za(j2,j3)/pow(-za(j1,j3)*zb(j1,j4)-za(j2,j3)*zb(j2,j4),2)\n      *pow(-za(j1,j3)*zb(j1,j6)-za(j2,j3)*zb(j2,j6),2)\n      /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n      *pow(-za(j1,j2)*zb(j1,j4)+za(j2,j3)*zb(j3,j4),2)\n      /zb(j5,j6)/t(j1,j2,j3))\n    +L0(-t(j1,j2,j3),-s(j1,j2))/s(j1,j2)*za(j1,j2)/za(j1,j3)\n    *zb(j1,j3)/(-za(j1,j3)*zb(j1,j4)-za(j2,j3)*zb(j2,j4))\n    *pow(-za(j1,j3)*zb(j1,j6)-za(j2,j3)*zb(j2,j6),2)\n    /zb(j5,j6)/t(j1,j2,j3);\n\n  s3 = s2+L0(-t(j1,j2,j3),-s(j2,j3))/s(j2,j3)*za(j1,j2)/za(j1,j3)\n    *zb(j1,j3)*(-za(j1,j3)*zb(j1,j6)-za(j2,j3)*zb(j2,j6))\n    /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n    *(za(j1,j2)*zb(j2,j6)+za(j1,j3)*zb(j3,j6))\n    /zb(j5,j6)/t(j1,j2,j3)\n    -L1(-t(j1,j2,j3),-s(j2,j3))/pow(s(j2,j3),2)*za(j2,j3)\n    *pow(zb(j1,j3),2)/(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n    *pow(za(j1,j2)*zb(j2,j6)+za(j1,j3)*zb(j3,j6),2)\n    /zb(j5,j6)/t(j1,j2,j3)/2.0;\n\n  s4 = s3+L0(-t(j1,j2,j3),-s(j2,j3))/s(j2,j3)*zb(j1,j3)\n    /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n    *(za(j1,j2)*zb(j2,j6)+za(j1,j3)*zb(j3,j6))\n    *(-za(j1,j2)*zb(j1,j6)+za(j2,j3)*zb(j3,j6))\n    /zb(j5,j6)/t(j1,j2,j3);\n\n  s5 = s4-L1(-s(j5,j6),-t(j1,j2,j3))/za(j2,j3)*pow(za(j2,j4),2)\n    /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n    *pow(zb(j4,j6),2)/zb(j5,j6)/t(j1,j2,j3)/2.0;\n\n  s6 = s5;\n\n  s8 = L0(-t(j1,j2,j3),-s(j5,j6))/s(j5,j6)*za(j2,j4)\n    /(-za(j1,j3)*zb(j1,j4)-za(j2,j3)*zb(j2,j4))\n    /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n    *pow(zb(j4,j6),2)/zb(j5,j6)*t(j1,j2,j3);\n\n  s10 = i3m(s(j1,j2),s(j3,j4),s(j5,j6));\n\n  s12 = -1.0/(-za(j1,j3)*zb(j1,j4)-za(j2,j3)*zb(j2,j4))\n    /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n    *(za(j2,j3)*zb(j3,j4)*(-za(j3,j5)*zb(j3,j6)-za(j4,j5)*zb(j4,j6))\n     -za(j1,j2)*zb(j1,j4)*(-za(j3,j5)*zb(j3,j6)+za(j4,j5)*zb(j4,j6)))\n    /2.0\n    -2.0*za(j1,j2)*za(j4,j5)*zb(j1,j3)\n    /(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n    *zb(j4,j6)/t(j1,j2,j3);\n\n  s13 = s12;\n\n  s15 = (pow(za(j4,j5),2)/za(j5,j6)*pow(zb(j1,j3),2)\n    /(za(j2,j4)*zb(j1,j2)+za(j3,j4)*zb(j1,j3))/zb(j2,j3)\n    -1.0/za(j2,j3)/(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\n    *pow(-za(j1,j2)*zb(j1,j6)+za(j2,j3)*zb(j3,j6),2)/zb(j5,j6))\n    /pow(t(j1,j2,j3),2)\n    *(2.0*s(j1,j2)*s(j5,j6)\n     +(-s(j1,j2)+s(j3,j4)-s