content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n#include <W2jet.hpp>\n#include <complex>\n#include <cmath>\n#include <cstring>\n#include <string>\n#include <constants_mod.hpp>\n#include <ZZclabels_mod.hpp>\n#include <ZZdlabels_mod.hpp>\n#include <first_mod.hpp>\n#include <ggZZ_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace constants_mod;\nusing namespace ZZclabels_mod;\nusing namespace ZZdlabels_mod;\nusing namespace first_mod;\nusing namespace ggZZ_mod;\n\nvoid ggZZcapture(const char* label, int label_len, int h34, int h56,\n                 int j1, int j2, int j3, int j4, int j5, int j6,\n                 std::complex<double>& amp0, std::complex<double>& amp2,\n                 std::complex<double>& amp4) {\n\n  const int imt0 = 1, imt2 = 2, imt4 = 3;\n  const int ipp = 1, imp = 2;\n\n  // Trim trailing spaces (Fortran trim())\n  int tlen = label_len;\n  while (tlen > 0 && label[tlen-1] == ' ') tlen--;\n  std::string lbl(label, tlen);\n\n  if (first) {\n    for (size_t i = 0; i < res.ni * res.nj * res.nk * res.nl; ++i) {\n      res.data[i] = czip;\n    }\n    first = false;\n  }\n\n  int htag = -1;\n  int ltag = 0, itag = 0;\n\n  // Canonical permutation:  1 2 3 4 5 6\n  if (j1 == 1 && j2 == 2 && j3 == 3 && j4 == 4 && j5 == 5 && j6 == 6) {\n    if (lbl == \"1x2\" && h34 == 1 && h56 == 1) {\n      htag = imp; ltag = 3; itag = c1_2;\n    }\n    if (lbl == \"1x2pp\" && h34 == 1 && h56 == 1) {\n      htag = ipp; ltag = 3; itag = c1_2;\n    }\n    if (lbl == \"1x34\" && h34 == 1 && h56 == 1) {\n      htag = imp; ltag = 3; itag = c1_34;\n    }\n    if (lbl == \"1x34pp\" && h34 == 1 && h56 == 1) {\n      htag = ipp; ltag = 3; itag = c1_34;\n    }\n    if (lbl == \"12x34\" && h34 == 1 && h56 == 1) {\n      htag = imp; ltag = 3; itag = c12_34;\n    }\n    if (lbl == \"12x34pp\" && h34 == 1 && h56 == 1) {\n      htag = ipp; ltag = 3; itag = c12_34;\n    }\n    if (lbl == \"1x34x2mp\" && h34 == 1 && h56 == 1) {\n      htag = imp; ltag = 4; itag = d1_34_2;\n    }\n    if (lbl == \"1x34x2pp\" && h34 == 1 && h56 == 1) {\n      htag = ipp; ltag = 4; itag = d1_34_2;\n    }\n    if (lbl == \"2x1x34pp\" && h34 == 1 && h56 == 1) {\n      htag = ipp; ltag = 4; itag = d2_1_34;\n    }\n    if (lbl == \"2x1x34\" && h34 == 1 && h56 == 1) {\n      htag = imp; ltag = 4; itag = d2_1_34;\n    }\n    if (lbl == \"d62x1x34\" && h34 == 1 && h56 == 1) {\n      htag = imp; ltag = 4; itag = d6_2_1_34;\n    }\n    if (label_len >= 6 && std::string(label, 5) == \"bubmp\" && h34 == 1 && h56 == 1) {\n      htag = imp; ltag = 2; itag = label[5] - '0';\n    }\n    if (label_len >= 6 && std::string(label, 5) == \"bubpp\" && h34 == 1 && h56 == 1) {\n      htag = ipp; ltag = 2; itag = label[5] - '0';\n    }\n  }\n\n  // Permute 1 and 2:  2 1 3 4 5 6\n  if (j1 == 2 && j2 == 1 && j3 == 3 && j4 == 4 && j5 == 5 && j6 == 6) {\n    if (lbl == \"1x34\" && h34 == 1 && h56 == 1) {\n      htag = imp; ltag = 3; itag = c2_34;\n      if (amp0 != czip) amp0 = std::conj(amp0);\n      if (amp2 != czip) amp2 = std::conj(amp2);\n      if (amp4 != czip) amp4 = std::conj(amp4);\n    }\n    if (lbl == \"1x34pp\" && h34 == 1 && h56 == 1) {\n      htag = ipp; ltag = 3; itag = c2_34;\n      if (amp0 != czip) amp0 = std::conj(amp0);\n      if (amp2 != czip) amp2 = std::conj(amp2);\n      if (amp4 != czip) amp4 = std::conj(amp4);\n    }\n    if (lbl == \"2x1x34\" && h34 == 1 && h56 == 1) {\n      htag = imp; ltag = 4; itag = d1_2_34;\n      if (amp0 != czip) amp0 = std::conj(amp0);\n      if (amp2 != czip) amp2 = std::conj(amp2);\n      if (amp4 != czip) amp4 = std::conj(amp4);\n    }\n    if (lbl == \"d62x1x34\" && h34 == 1 && h56 == 1) {\n      htag = imp; ltag = 4; itag = d6_1_2_34;\n      if (amp0 != czip) amp0 = std::conj(amp0);\n      if (amp2 != czip) amp2 = std::conj(amp2);\n      if (amp4 != czip) amp4 = std::conj(amp4);\n    }\n  }\n\n  // Permute 3,4 and 5,6:  1 2 5 6 3 4\n  if (j1 == 1 && j2 == 2 && j3 == 5 && j4 == 6 && j5 == 3 && j6 == 4) {\n    if (lbl == \"1x34\" && h34 == 1 && h56 == 1) {\n      htag = imp; ltag = 3; itag = c1_56;\n    }\n    if (lbl == \"1x34pp\" && h34 == 1 && h56 == 1) {\n      htag = ipp; ltag = 3; itag = c1_56;\n    }\n    if (lbl == \"2x1x34pp\" && h34 == 1 && h56 == 1) {\n      htag = ipp; ltag = 4; itag = d1_2_34;\n    }\n  }\n\n  // Permute 1,3,4 and 2,5,6:  2 1 5 6 3 4\n  if (j1 == 2 && j2 == 1 && j3 == 5 && j4 == 6 && j5 == 3 && j6 == 4) {\n    if (lbl == \"1x34\" && h34 == 1 && h56 == 1) {\n      htag = imp; ltag = 3; itag = c2_56;\n      if (amp0 != czip) amp0 = std::conj(amp0);\n      if (amp2 != czip) amp2 = std::conj(amp2);\n      if (amp4 != czip) amp4 = std::conj(amp4);\n    }\n    if (lbl == \"1x34pp\" && h34 == 1 && h56 == 1) {\n      htag = ipp; ltag = 3; itag = c2_56;\n      if (amp0 != czip) amp0 = std::conj(amp0);\n      if (amp2 != czip) amp2 = std::conj(amp2);\n      if (amp4 != czip) amp4 = std::conj(amp4);\n    }\n  }\n\n  if (htag < 0) {\n    return;\n  }\n\n  // assign results\n  res(htag, ltag, itag, imt0) = amp0; // @coverage-probe\n  res(htag, ltag, itag, imt2) = amp2;\n  res(htag, ltag, itag, imt4) = amp4;\n\n  if (std::abs(res(htag, ltag, itag, imt0)) < 1e-8)\n    res(htag, ltag, itag, imt0) = czip;\n  if (std::abs(res(htag, ltag, itag, imt2)) < 1e-8)\n    res(htag, ltag, itag, imt2) = czip;\n  if (std::abs(res(htag, ltag, itag, imt4)) < 1e-8)\n    res(htag, ltag, itag, imt4) = czip;\n}\n\nextern \"C\" {\n  void ggZZcapture_wrapper(const char* label, int label_len, int h34, int h56,\n                           int j1, int j2, int j3, int j4, int j5, int j6,\n                           std::complex<double>* amp0, std::complex<double>* amp2,\n                           std::complex<double>* amp4) {\n    ggZZcapture(label, label_len, h34, h56, j1, j2, j3, j4, j5, j6,\n                *amp0, *amp2, *amp4);\n  }\n}\n"
