content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n#include <W2jet.hpp>\n#include <complex>\n#include <cmath>\n#include <constants_mod.hpp>\n#include <mxpart_mod.hpp>\n#include <lc_mod.hpp>\n#include <mmsq_cs_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace constants_mod;\nusing namespace mxpart_mod;\nusing namespace lc_mod;\nusing namespace mmsq_cs_mod;\n\nvoid w2jetsq(int i1, int i2, int i3, int i4, int i5, int i6,\n             FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb,\n             double& msq) {\n\n  FArray2D<std::complex<double>> qcd1(3, 3, -1, -1);\n  FArray2D<std::complex<double>> qcd2(3, 3, -1, -1);\n  FArray2D<std::complex<double>> qed(3, 3, -1, -1);\n\n  subqcd(i1, i2, i3, i4, i5, i6, za, zb, qcd1);\n  subqcd(i1, i2, i3, i4, i6, i5, za, zb, qcd2);\n\n  qed(+1, +1) = qcd1(+1, +1) + qcd2(+1, +1);\n  qed(+1, -1) = qcd1(+1, -1) + qcd2(-1, +1);\n  qed(-1, +1) = qcd1(-1, +1) + qcd2(+1, -1);\n  qed(-1, -1) = qcd1(-1, -1) + qcd2(-1, -1);\n\n  double msq1 = pow(std::abs(qcd1(+1, +1)), 2) + pow(std::abs(qcd1(+1, -1)), 2)\n              + pow(std::abs(qcd1(-1, +1)), 2) + pow(std::abs(qcd1(-1, -1)), 2);\n\n  double msq2 = pow(std::abs(qcd2(+1, +1)), 2) + pow(std::abs(qcd2(+1, -1)), 2)\n              + pow(std::abs(qcd2(-1, +1)), 2) + pow(std::abs(qcd2(-1, -1)), 2);\n\n  double msqq = pow(std::abs(qed(+1, +1)), 2) + pow(std::abs(qed(+1, -1)), 2)\n              + pow(std::abs(qed(-1, +1)), 2) + pow(std::abs(qed(-1, -1)), 2);\n\n  mmsq_cs(0, +1, +1) = 0.0;\n  mmsq_cs(1, +1, +1) = 0.0;\n  mmsq_cs(2, +1, +1) = 0.0;\n\n  if (colourchoice == 1 || colourchoice == 0) {\n    mmsq_cs(1, +1, +1) = msq1;\n    mmsq_cs(2, +1, +1) = msq2;\n  }\n  if (colourchoice == 2 || colourchoice == 0) {\n    mmsq_cs(0, +1, +1) = -ninth * msqq;\n  }\n\n  msq = mmsq_cs(0, +1, +1) + mmsq_cs(1, +1, +1) + mmsq_cs(2, +1, +1); // @coverage-probe\n}\n\nextern \"C\" {\n  void w2jetsq_wrapper(int i1, int i2, int i3, int i4, int i5, int i6,\n                       std::complex<double>* fza, std::complex<double>* fzb,\n                       double* msq) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    w2jetsq(i1, i2, i3, i4, i5, i6, za, zb, *msq);\n  }\n}\n"
