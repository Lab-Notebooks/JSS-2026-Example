content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq.7.2\n#include <BDK.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstd::complex<double> M2abit2(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  // Statement functions as lambdas\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zba2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return zb(i1,i2)*za(i2,i4) + zb(i1,i3)*za(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n  auto zba = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return zb(i1,i2)*za(i2,i3);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  double delta12 = s(j1,j2) - s(j3,j4) - s(j5,j6);\n  double delta34 = s(j3,j4) - s(j5,j6) - s(j1,j2);\n  double delta56 = s(j5,j6) - s(j1,j2) - s(j3,j4);\n  double Delta3 = pow(s(j1,j2),2) + pow(s(j3,j4),2) + pow(s(j5,j6),2)\n      - 2.0*s(j1,j2)*s(j3,j4) - 2.0*s(j3,j4)*s(j5,j6) - 2.0*s(j5,j6)*s(j1,j2);\n\n  std::complex<double> result =\n      -0.5/(zb(j2,j3)*zab2(j4,j1,j2,j3)*Delta3)\n      *(\n      -6.0*zb(j1,j2)*zab2(j5,j1,j2,j6)*zb(j4,j3)*zab2(j3,j1,j2,j4)\n      *(za(j2,j4)*delta56-2.0*zab(j2,j1,j3)*za(j3,j4))/Delta3\n\n      +zb(j1,j3)/zab2(j4,j1,j2,j3)\n      *(delta34*(t(j1,j2,j3)-t(j1,j2,j4))-Delta3)\n      *(zab(j5,j3,j4)*za(j4,j5)/za(j5,j6)\n       +zba(j6,j3,j4)*zb(j4,j6)/zb(j5,j6))\n\n      +zab(j5,j3,j4)/za(j5,j6)\n      *(2.0*(zab(j5,j4,j1)*delta34-zab(j5,j6,j1)*delta56)\n      +zab2(j4,j2,j3,j1)*zab2(j5,j1,j2,j4))\n\n      -zb(j4,j6)/zb(j5,j6)\n      *(2.0*zab(j3,j2,j1)\n      *(zb(j3,j6)*delta12-2.0*zba(j3,j4,j5)*zb(j5,j6))\n      +zba2(j1,j2,j3,j4)*zb(j4,j3)*zab2(j3,j1,j2,j6)\n      -3.0*zba(j6,j4,j3)*zb(j3,j1)*delta34));\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> m2abit2_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return M2abit2(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
