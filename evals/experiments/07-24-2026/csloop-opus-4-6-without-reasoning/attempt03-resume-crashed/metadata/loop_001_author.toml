content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower\n// Published in Nucl.Phys.B513:3-86,1998.\n// e-Print: hep-ph/9708239\n// Eqs.(11.1) and Eqs.(11.6)\n#include <BDK.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <heldefs_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\nusing namespace heldefs_mod;\n\n// Forward declarations for helper functions in this translation unit\nstatic std::complex<double> Brackpm(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb);\nstatic std::complex<double> Brackpma(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb);\n\nstd::complex<double> Fvs(int st, int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  // Statement functions as lambdas\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  // Brackppa: square bracket in Eq.(11.1) subject to exchange 16,25\n  auto Brackppa = [&](int a1, int a2, int a3, int a4, int a5, int a6) -> std::complex<double> {\n    return za(a1,a2)*pow(za(a5,a3)*zb(a3,a1),2)/za(a5,a6)/pow(za(a3,a4),2)\n        *L1(-t(a1,a2,a3),-s(a1,a2))/(s(a1,a2)*s(a1,a2))\n        +za(a5,a2)*za(a5,a3)*zb(a3,a1)/za(a5,a6)/pow(za(a3,a4),2)\n        *L0(-t(a1,a2,a3),-s(a1,a2))/s(a1,a2);\n  };\n\n  // Brackpp: whole expression in Eq.(11.1) subject to exchange 34\n  auto Brackpp = [&](int a1, int a2, int a3, int a4, int a5, int a6) -> std::complex<double> {\n    return -za(a2,a3)*za(a2,a4)*za(a3,a5)*za(a4,a5)\n        /za(a1,a2)/za(a5,a6)/pow(za(a3,a4),4)\n        *Lsm1_2me(t(a1,a2,a3),t(a1,a2,a4),s(a1,a2),s(a5,a6))\n         -(za(a2,a4)*za(a3,a5)+za(a2,a3)*za(a4,a5))\n        /za(a1,a2)/za(a5,a6)/pow(za(a3,a4),3)\n        *(za(a5,a3)*zb(a3,a1)*za(a1,a2)\n        *L0(-t(a1,a2,a3),-s(a1,a2))/s(a1,a2)\n        +za(a5,a6)*zb(a6,a4)*za(a4,a2)\n        *L0(-t(a1,a2,a3),-s(a5,a6))/s(a5,a6)\n        +0.5*za(a5,a2)*(lnrat(-t(a1,a2,a3),-t(a1,a2,a4))))\n        -Brackppa(a1,a2,a3,a4,a5,a6)-Brackppa(a6,a5,a3,a4,a2,a1)\n        +0.5/pow(za(a3,a4),2)\n        *(za(a2,a5)*za(a2,a5)/za(a1,a2)/za(a5,a6)\n        -zb(a1,a6)*zb(a1,a6)/zb(a1,a2)/zb(a5,a6));\n  };\n\n  std::complex<double> result;\n\n  if (st == hqpqbmgpgm) {\n    // flip2: (1<-->2, 3<-->4, 5<-->6, za<-->zb)\n    result = +Brackpm(j1,j2,j3,j4,j5,j6,za,zb)\n             +Brackpm(j2,j1,j4,j3,j6,j5,zb,za);\n  } else if (st == hqpqbmgpgp) {\n    // exch34: (3<-->4)\n    result = +Brackpp(j1,j2,j3,j4,j5,j6)\n             +Brackpp(j1,j2,j4,j3,j5,j6);\n  } else {\n    result = std::complex<double>(0.0, 0.0);\n  }\n\n  result = result; // @coverage-probe\n  return result;\n}\n\n// Brackpm: whole expression in Eq.(11.6) subject to exchange flip_2\nstatic std::complex<double> Brackpm(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n  auto delta = [&](int i1, int i2, int i3, int i4, int i5, int i6) -> double {\n    return s(i1,i2) - s(i3,i4) - s(i5,i6);\n  };\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n\n  double IDelta = 1.0/(pow(s(j1,j2),2) + pow(s(j3,j4),2) + pow(s(j5,j6),2)\n      - 2.0*(+s(j1,j2)*s(j3,j4)+s(j1,j2)*s(j5,j6)+s(j5,j6)*s(j3,j4)));\n\n  std::complex<double> result =\n      -2.0*za(j2,j3)*zb(j4,j6)*zab2(j3,j1,j2,j6)\n      *zab2(j2,j5,j6,j4)*t(j1,j2,j3)\n      /za(j1,j2)/zb(j5,j6)/pow(zab2(j3,j1,j2,j4),4)\n      *Lsm1_2mh(s(j3,j4),t(j1,j2,j3),s(j1,j2),s(j5,j6))\n      +(2.0*za(j2,j3)*zb(j4,j6)\n      *(zb(j1,j2)*za(j5,j6)*za(j2,j3)*zb(j4,j6)\n      -zab2(j5,j2,j4,j1)*zab2(j3,j1,j2,j4))*zab2(j4,j1,j2,j3)\n      *(t(j1,j2,j3)-t(j1,j2,j4))/pow(zab2(j3,j1,j2,j4),3)*IDelta\n      -3.0*(s(j3,j4)*delta(j3,j4,j1,j2,j5,j6)*zab2(j2,j3,j4,j1)\n       *zab2(j5,j3,j4,j6)*IDelta\n      -za(j2,j3)*zb(j3,j1)*za(j5,j4)*zb(j4,j6)\n      -za(j2,j4)*zb(j4,j1)*za(j5,j3)*zb(j3,j6))\n      *zab2(j4,j1,j2,j3)/zab2(j3,j1,j2,j4)*IDelta\n      -zb(j1,j4)*za(j3,j5)*za(j2,j3)*zb(j4,j6)\n      *pow(zab2(j4,j1,j2,j3),2)/pow(zab2(j3,j1,j2,j4),2)*IDelta\n      -zb(j1,j3)*za(j4,j5)*za(j2,j4)*zb(j3,j6)*IDelta)\n      *i3m(s(j1,j2),s(j3,j4),s(j5,j6))\n      +(2.0*za(j2,j3)*zb(j4,j6)*t(j1,j2,j3)*zab2(j2,j1,j4,j6)\n      /za(j1,j2)/zb(j5,j6)/pow(zab2(j3,j1,j2,j4),3)\n      -(pow(zab2(j2,j1,j4,j6),2)\n       +2.0*za(j2,j3)*zb(j3,j6)*za(j2,j4)*zb(j4,j6))\n      /za(j1,j2)/zb(j5,j6)/pow(zab2(j3,j1,j2,j4),2))\n      *lnrat(-t(j1,j2,j3),-s(j3,j4))\n      // flip3: (1<-->5, 2<-->6, 3<-->4, za<-->zb)\n       +Brackpma(j1,j2,j3,j4,j5,j6,za,zb)\n       +Brackpma(j5,j6,j4,j3,j1,j2,zb,za)\n       +zb(j1,j6)*zab2(j4,j1,j2,j3)\n       *(zb(j1,j6)*delta(j3,j4,j5,j6,j1,j2)\n      -2.0*zb(j1,j2)*za(j2,j5)*zb(j5,j6))\n      /zb(j1,j2)/zb(j5,j6)/zab2(j3,j1,j2,j4)*IDelta\n       +(pow(zab2(j2,j1,j4,j6),2)+za(j2,j1)*zb(j1,j6)*za(j2,j5)*zb(j5,j6))\n      /za(j1,j2)/zb(j5,j6)/pow(zab2(j3,j1,j2,j4),2);\n\n  return result;\n}\n\n// Brackpma: curly braces expression in Eq.(11.6) subject to flip_3\nstatic std::complex<double> Brackpma(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n  auto delta = [&](int i1, int i2, int i3, int i4, int i5, int i6) -> double {\n    return s(i1,i2) - s(i3,i4) - s(i5,i6);\n  };\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n\n  double IDelta = 1.0/(pow(s(j1,j2),2) + pow(s(j3,j4),2) + pow(s(j5,j6),2)\n      - 2.0*(s(j1,j2)*s(j3,j4)+s(j1,j2)*s(j5,j6)+s(j5,j6)*s(j3,j4)));\n\n  std::complex<double> result =\n      2.0*zb(j1,j2)*za(j2,j3)*zb(j3,j6)\n      /zb(j5,j6)/pow(zab2(j3,j1,j2,j4),2)\n      *(zab2(j3,j1,j2,j6)*zab2(j2,j1,j3,j4)/zab2(j3,j1,j2,j4)\n      *L0(-t(j1,j2,j3),-s(j1,j2))/s(j1,j2)\n      -za(j2,j3)*zb(j3,j6)\n      *(L0(-t(j1,j2,j3),-s(j1,j2))/s(j1,j2)\n      -0.5*L1(-t(j1,j2,j3),-s(j1,j2))/s(j1,j2)))\n      -(3.0*delta(j5,j6,j3,j4,j1,j2)*zab2(j2,j3,j4,j1)\n      *zab2(j5,j3,j4,j6)*zab2(j4,j1,j2,j3)\n      /zab2(j3,j1,j2,j4)*(IDelta*IDelta)\n      +2.0*za(j3,j2)*zb(j2,j1)*zb(j4,j6)*(t(j1,j2,j3)-t(j1,j2,j4))\n      *(za(j2,j5)*t(j1,j2,j3)+za(j2,j1)*zb(j1,j6)*za(j6,j5))\n      /pow(zab2(j3,j1,j2,j4),3)*IDelta\n      -(2.0*za(j2,j3)*zb(j3,j6)*(t(j1,j2,j3)-t(j1,j2,j4))\n      +delta(j1,j2,j3,j4,j5,j6)\n      *(za(j2,j5)*t(j1,j2,j3)\n      +za(j2,j1)*zb(j1,j6)*za(j6,j5))/za(j5,j6))\n      *za(j5,j2)*zb(j2,j1)/pow(zab2(j3,j1,j2,j4),2)*IDelta\n      +0.5*(za(j1,j2)*zb(j1,j6)*zb(j1,j6)/zb(j5,j6)\n       +zb(j1,j2)*za(j2,j5)*za(j2,j5)/za(j5,j6)\n      -2.0*za(j2,j5)*zb(j1,j6))*zab2(j4,j1,j2,j3)\n      /zab2(j3,j1,j2,j4)*IDelta)\n      *(lnrat(-s(j1,j2),-s(j3,j4)));\n\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> fvs_wrapper(int st, int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return Fvs(st, j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
