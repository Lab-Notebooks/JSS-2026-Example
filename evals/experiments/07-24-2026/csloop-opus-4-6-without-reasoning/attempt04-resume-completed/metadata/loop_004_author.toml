content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq9.6\n#include <BDK.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstatic std::complex<double> FPFPsc1(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      -0.5*za(j1,j3)*pow(za(j5,j3),2)\n      /(za(j1,j2)*za(j2,j3)*za(j3,j4)*za(j4,j1)*za(j5,j6));\n}\n\nstatic std::complex<double> FPFPsc2(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      -za(j1,j3)*pow(za(j5,j1),2)*zb(j1,j2)\n      /(za(j1,j2)*za(j5,j6)*pow(za(j4,j1),2));\n}\n\nstatic std::complex<double> FPFPsc3(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      +za(j3,j4)*pow(za(j5,j1),2)*zb(j2,j4)\n      /(za(j1,j2)*za(j5,j6)*pow(za(j4,j1),2));\n}\n\nstatic std::complex<double> FPFPsc4(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n\n  return\n      -za(j1,j3)*za(j5,j1)*za(j5,j4)*zab2(j3,j1,j2,j4)\n      /(za(j1,j2)*za(j2,j3)*za(j5,j6)*pow(za(j4,j1),2));\n}\n\nstatic std::complex<double> FPFPsc5(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      +za(j1,j3)*zb(j6,j4)*za(j5,j3)/(za(j1,j2)*za(j2,j3)*za(j4,j1));\n}\n\nstatic std::complex<double> FPFPsc6(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n\n  return\n      +za(j1,j3)*pow(za(j5,j1),2)*zab2(j3,j2,j4,j1)\n      /(za(j1,j2)*za(j2,j3)*za(j5,j6)*pow(za(j4,j1),2));\n}\n\nstatic std::complex<double> FPFPsc7(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      -pow(za(j1,j3),2)*za(j5,j3)*zb(j6,j1)\n      /(za(j1,j2)*za(j2,j3)*za(j3,j4)*za(j4,j1));\n}\n\nstatic std::complex<double> FPFPsc8(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      -0.5*za(j2,j3)*pow(za(j5,j4),2)*pow(zb(j4,j2),2)\n      /(za(j1,j4)*za(j5,j6)*za(j2,j4));\n}\n\nstatic std::complex<double> FPFPsc9(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      -0.5*pow(za(j5,j2),2)*pow(zb(j2,j4),2)*za(j4,j3)\n      /(za(j1,j2)*za(j5,j6)*za(j2,j4));\n}\n\nstatic std::complex<double> FPFPsc10(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      -za(j1,j3)*za(j3,j4)*za(j5,j6)*pow(zb(j6,j4),2)\n      /(za(j1,j2)*za(j2,j3)*za(j4,j1));\n}\n\nstatic std::complex<double> FPFPsc11(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      -0.5*pow(za(j1,j3),3)*za(j5,j6)*pow(zb(j6,j1),2)\n      /(za(j1,j2)*za(j2,j3)*za(j3,j4)*za(j4,j1));\n}\n\nstd::complex<double> FPFPsc(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  double s123 = t(j1,j2,j3);\n  double s234 = t(j2,j3,j4);\n  double s23 = s(j2,j3);\n  double s56 = s(j5,j6);\n\n  std::complex<double> result =\n      za(j3,j4)*pow(za(j5,j2),2)*pow(zb(j2,j4),2)\n      /(za(j1,j2)*za(j5,j6)*za(j2,j4))\n      *Ls1(-s23,-s234,-s(j3,j4),-s234)\n      /pow(s234,2)\n\n      - za(j1,j3)*za(j3,j4)*pow(za(j5,j1),2)\n      /(za(j1,j2)*za(j2,j3)*za(j5,j6)*pow(za(j4,j1),3))\n      *Lsm1_2me(s123,s234,s23,s56)\n\n      + FPFPsc1(j1,j2,j3,j4,j5,j6,za,zb)*lnrat(-s234,-s56)\n      + FPFPsc2(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s123,-s23)/s23\n      + FPFPsc3(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s23)/s23\n      + FPFPsc4(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s123,-s56)/s56\n      + FPFPsc5(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s123,-s56)/s56\n      + FPFPsc6(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s56)/s56\n      + FPFPsc7(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s56)/s56\n      + FPFPsc8(j1,j2,j3,j4,j5,j6,za,zb)*L1(-s23,-s234)/pow(s234,2)\n      + FPFPsc9(j1,j2,j3,j4,j5,j6,za,zb)*L1(-s(j3,j4),-s234)/pow(s234,2)\n      + FPFPsc10(j1,j2,j3,j4,j5,j6,za,zb)*L1(-s123,-s56)/pow(s56,2)\n      + FPFPsc11(j1,j2,j3,j4,j5,j6,za,zb)*L1(-s234,-s56)/pow(s56,2)\n\n      + 0.5*zb(j2,j4)*zab2(j1,j2,j4,j6)*zab2(j3,j2,j4,j6)\n      /(za(j1,j2)*za(j4,j1)*zb(j5,j6)*t(j1,j2,j4)*s234)\n\n      + 0.5*za(j2,j4)*pow(zb(j2,j4),2)*za(j5,j1)*za(j5,j3)\n      /(za(j1,j2)*za(j4,j1)*za(j5,j6)*t(j1,j2,j4)*s234)\n\n      + 0.5*za(j1,j3)*pow(za(j3,j5),2)\n      /(za(j1,j2)*za(j2,j3)*za(j3,j4)*za(j4,j1)*za(j5,j6));\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> fpfpsc_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return FPFPsc(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
