path = "software/mcfm/src/BDK/FMPFcc.cpp"
content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq8.18\n#include <BDK.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstatic std::complex<double> FMPFcc_unsym(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab3 = [&](int i1, int i2, int i3, int i4, int i5) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i5) + za(i1,i3)*zb(i3,i5) + za(i1,i4)*zb(i4,i5);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n  auto zb12b = [&](int i1, int i2, int i3, int i4, int i5) -> std::complex<double> {\n    return zb(i1,i2)*zab2(i2,i3,i4,i5);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  double delta34 = s(j3,j4) - s(j5,j6) - s(j1,j2);\n  double delta56 = s(j5,j6) - s(j1,j2) - s(j3,j4);\n\n  std::complex<double> result =\n      (pow(zb(j1,j3),3)*pow(za(j4,j5),2)\n      /(zb(j1,j2)*zb(j2,j3)*za(j5,j6)*t(j1,j2,j3)*zab2(j4,j2,j3,j1))\n      + pow(za(j1,j2),3)*pow(zab2(j3,j1,j2,j6),2)\n      /(za(j2,j3)*zb(j5,j6)*pow(za(j1,j3),3)*t(j1,j2,j3)*zab2(j1,j2,j3,j4))\n      - za(j1,j2)*za(j2,j3)*pow(zab2(j1,j2,j3,j6),2)\n      /(zb(j5,j6)*pow(za(j1,j3),3)*t(j1,j2,j3)*zab2(j1,j2,j3,j4)))\n      *Lsm1(-s(j1,j2),-t(j1,j2,j3),-s(j2,j3),-t(j1,j2,j3))\n//    pmpm_gf_b2\n      + (pow(zb(j1,j3),3)*pow(za(j4,j5),2)\n      /(zb(j1,j2)*zb(j2,j3)*za(j5,j6)*t(j1,j2,j3)*zab2(j4,j2,j3,j1))\n      + pow(zab2(j3,j1,j2,j6),2)*pow(zab2(j2,j1,j3,j4),3)\n      /(za(j2,j3)*zb(j5,j6)*t(j1,j2,j3)\n      *zab2(j1,j2,j3,j4)*pow(zab2(j3,j1,j2,j4),3))\n      - za(j2,j3)*pow(zb(j4,j6),2)*t(j1,j2,j3)*zab2(j2,j1,j3,j4)\n      /(zb(j5,j6)*zab2(j1,j2,j3,j4)*pow(zab2(j3,j1,j2,j4),3)))\n      *Lsm1_2mh(s(j3,j4),t(j1,j2,j3),s(j1,j2),s(j5,j6))\n//    Three-mass triangle coefficient (D=6 form): pmpm_gf_3m_nodel_1\n      + (-2.0*zab(j2,j1,j3)*zab(j5,j4,j6)*zab2(j2,j1,j3,j4)\n      /(t(j1,j2,j3)*zab2(j3,j1,j2,j4)*zab2(j1,j2,j3,j4))\n      - 0.5*(t(j1,j2,j3)*delta34 + 2.0*s(j1,j2)*s(j5,j6))/pow(t(j1,j2,j3),2)\n      *(pow(zb(j1,j3),3)*pow(za(j4,j5),2)\n      /(zb(j1,j2)*zb(j2,j3)*za(j5,j6)*zab2(j4,j2,j3,j1))\n      + pow(zab2(j2,j1,j3,j6),2)*zab2(j2,j1,j3,j4)\n      /(za(j2,j3)*zb(j5,j6)*zab2(j3,j1,j2,j4)*zab2(j1,j2,j3,j4)))\n      + 0.5/(zab2(j1,j3,j4,j2)*zab2(j3,j1,j2,j4)*zab2(j1,j2,j3,j4))\n      *(\n      zb(j3,j6)*zab(j2,j4,j6)*zab2(j2,j1,j3,j4)*zab2(j1,j3,j4,j2)\n      /zb(j5,j6)\n      - zab(j2,j1,j6)*zab(j2,j4,j6)*zab3(j4,j1,j2,j3,j4)\n      *zab2(j1,j3,j4,j2)/(za(j3,j4)*zb(j5,j6))\n      - (zab(j1,j4,j6)*zab(j2,j3,j4)*zab(j5,j6,j1)*za(j1,j4)/za(j3,j4))\n      + za(j1,j5)*zab(j2,j3,j4)\n      *(zb(j3,j6)*t(j2,j3,j4) - zb12b(j3,j4,j1,j3,j6))\n      - zab(j2,j1,j6)*zab(j1,j4,j3)*zab(j5,j2,j4)\n      - 0.5*s(j1,j4)*za(j4,j5)*zb(j1,j6)*delta56*zab2(j1,j2,j3,j4)\n      /(zb(j1,j2)*za(j3,j4))\n      + 0.5*(s(j1,j4) - s(j2,j3))\n      *za(j1,j2)*zb(j3,j4)*zab2(j5,j2,j3,j6)))\n      *i3m(s(j1,j2),s(j3,j4),s(j5,j6))\n//    L_0 terms:\n      - 2.0*zab(j2,j1,j3)*zab2(j2,j1,j3,j6)\n      /(zb(j5,j6)*za(j1,j3)*t(j1,j2,j3))\n      *(zab2(j3,j1,j2,j6)/zab2(j3,j1,j2,j4)\n      *L0(-t(j1,j2,j3),-s(j1,j2))/s(j1,j2)\n      + zab2(j1,j2,j3,j6)/zab2(j1,j2,j3,j4)\n      *L0(-t(j1,j2,j3),-s(j2,j3))/s(j2,j3))\n      - 2.0*zab(j2,j4,j6)*zab2(j2,j1,j3,j6)*zab2(j2,j1,j3,j4)\n      /(za(j2,j3)*zb(j5,j6)*zab2(j3,j1,j2,j4)*zab2(j1,j2,j3,j4))\n      *L0(-t(j1,j2,j3),-s(j5,j6))/s(j5,j6)\n      + Master1(j1,j2,j3,j4,j5,j6,za,zb);\n//    +flip1\n\n  return result;\n}\n\nstd::complex<double> FMPFcc(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  std::complex<double> result =\n      FMPFcc_unsym(j1,j2,j3,j4,j5,j6,za,zb)\n    + FMPFcc_unsym(j4,j3,j2,j1,j6,j5,zb,za);\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> fmpfcc_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return FMPFcc(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
