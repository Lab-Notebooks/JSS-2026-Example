content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq10.16\n#include <BDK.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstatic std::complex<double> FFPMcc1(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  return\n      +2.0*zab(j5,j1,j3)*zab2(j1,j2,j4,j3)*zab2(j5,j2,j4,j3)\n      /(zb(j3,j4)*za(j5,j6)*zab2(j1,j2,j3,j4)*zab2(j1,j3,j4,j2));\n}\n\nstatic std::complex<double> FFPMcc2(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  return\n      +2.0*zab(j4,j2,j3)*zab2(j5,j2,j3,j4)*zab2(j5,j2,j4,j3)\n      /(za(j5,j6)*t(j2,j3,j4)*zb(j2,j4)*zab2(j1,j2,j3,j4));\n}\n\nstatic std::complex<double> FFPMcc3(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  return\n      +2.0*zab(j4,j2,j3)*zab2(j5,j2,j4,j3)*zab2(j5,j3,j4,j2)\n      /(za(j5,j6)*t(j2,j3,j4)*zb(j2,j4)*zab2(j1,j3,j4,j2));\n}\n\nstatic std::complex<double> FFPMcc_unsym(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  double s123 = t(j1,j2,j3);\n  double s234 = t(j2,j3,j4);\n\n  std::complex<double> result =\n      (pow(za(j1,j2)*zb(j4,j6)*s123,2)\n      /(za(j2,j3)*zb(j5,j6)*pow(zab2(j1,j2,j3,j4),3)*zab2(j3,j1,j2,j4))\n      - pow(zab2(j1,j2,j3,j6)*zab2(j2,j1,j3,j4),2)\n      /(za(j2,j3)*zb(j5,j6)*pow(zab2(j1,j2,j3,j4),3)*zab2(j3,j1,j2,j4)))\n      *Lsm1_2mh(s(j1,j4),s123,s(j2,j3),s(j5,j6))\n\n      + (pow(zab2(j2,j1,j3,j4)*zab2(j3,j1,j2,j6),2)\n      /(za(j2,j3)*zb(j5,j6)*zab2(j1,j2,j3,j4)*pow(zab2(j3,j1,j2,j4),3))\n      - za(j2,j3)*pow(zb(j4,j6)*s123,2)\n      /(zb(j5,j6)*zab2(j1,j2,j3,j4)*pow(zab2(j3,j1,j2,j4),3)))\n      *Lsm1_2mh(s(j3,j4),s123,s(j1,j2),s(j5,j6))\n\n      + (pow(zb(j2,j3)*za(j1,j5),2)*s234*zab2(j1,j2,j4,j3)\n      /(zb(j3,j4)*za(j5,j6)*zab2(j1,j2,j3,j4)*pow(zab2(j1,j3,j4,j2),3))\n      - pow(zab2(j1,j2,j4,j3),3)*pow(zab2(j5,j3,j4,j2),2)\n      /(zb(j3,j4)*za(j5,j6)*s234\n      *zab2(j1,j2,j3,j4)*pow(zab2(j1,j3,j4,j2),3))\n      - pow(za(j2,j4),3)*pow(zb(j1,j6),2)\n      /(za(j2,j3)*za(j3,j4)*zb(j5,j6)*s234*zab2(j2,j3,j4,j1)))\n      *Lsm1_2mh(s(j1,j2),s234,s(j3,j4),s(j5,j6))\n\n      + (pow(za(j1,j2)*zab2(j3,j1,j2,j6),2)\n      /(za(j2,j3)*zb(j5,j6)*pow(za(j1,j3),2)\n      *zab2(j1,j2,j3,j4)*zab2(j3,j1,j2,j4))\n      - za(j2,j3)*pow(zab2(j1,j2,j3,j6),2)\n      /(zb(j5,j6)*pow(za(j1,j3),2)*zab2(j1,j2,j3,j4)*zab2(j3,j1,j2,j4)))\n      *Lsm1(-s(j1,j2),-s123,-s(j2,j3),-s123)\n\n      + (pow(zab2(j5,j2,j3,j4)*zb(j2,j3),2)\n      /(za(j5,j6)*s234*pow(zb(j2,j4),3)*zab2(j1,j2,j3,j4))\n      - pow(zab2(j5,j3,j4,j2)*zb(j3,j4),2)\n      /(za(j5,j6)*s234*pow(zb(j2,j4),3)*zab2(j1,j2,j3,j4)))\n      *Lsm1(-s(j2,j3),-s234,-s(j3,j4),-s234)\n\n      + FFPMccT(j1,j2,j3,j4,j5,j6,za,zb)\n      *i3m(s(j1,j2),s(j3,j4),s(j5,j6))\n      + FFPMccTtilde(j1,j2,j3,j4,j5,j6,za,zb)\n      *i3m(s(j1,j4),s(j2,j3),s(j5,j6))\n\n      + FFPMcc1(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s(j5,j6))/s(j5,j6)\n      + FFPMcc2(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s(j2,j3))/s(j2,j3)\n      + FFPMcc3(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s(j3,j4))/s(j3,j4)\n\n      + Master1(j1,j4,j3,j2,j5,j6,za,zb);\n//    +flip2\n\n  return result;\n}\n\nstd::complex<double> FFPMcc(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  std::complex<double> result =\n      FFPMcc_unsym(j1,j2,j3,j4,j5,j6,za,zb)\n    + FFPMcc_unsym(j2,j1,j4,j3,j6,j5,zb,za);\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> ffpmcc_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return FFPMcc(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
