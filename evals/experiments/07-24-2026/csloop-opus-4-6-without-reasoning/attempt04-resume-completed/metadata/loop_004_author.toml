content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq8.12\n#include <BDK.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstatic std::complex<double> FPMFcc_unsym(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zba2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return zb(i1,i2)*za(i2,i4) + zb(i1,i3)*za(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n  auto zb21b = [&](int i1, int i2, int i3, int i4, int i5) -> std::complex<double> {\n    return zba2(i1,i2,i3,i4)*zb(i4,i5);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  std::complex<double> result =\n      (za(j1,j3)*pow(zab2(j3,j1,j2,j6),2)\n      /(za(j1,j2)*za(j2,j3)*zb(j5,j6)*t(j1,j2,j3)*zab2(j1,j2,j3,j4))\n      + pow(zb(j1,j2),3)*pow(za(j4,j5),2)\n      /(zb(j2,j3)*zb(j1,j3)*za(j5,j6)*t(j1,j2,j3)*zab2(j4,j2,j3,j1)))\n      *Lsm1(-s(j1,j2),-t(j1,j2,j3),-s(j2,j3),-t(j1,j2,j3))\n\n      + (za(j1,j3)*pow(zab2(j3,j1,j2,j6),2)\n      /(za(j1,j2)*za(j2,j3)*zb(j5,j6)*t(j1,j2,j3)*zab2(j1,j2,j3,j4))\n      + pow(zb(j1,j2)*za(j4,j5),2)*zab2(j4,j1,j3,j2)\n      /(zb(j2,j3)*za(j5,j6)*t(j1,j2,j3)\n      *zab2(j4,j2,j3,j1)*zab2(j4,j1,j2,j3)))\n      *Lsm1_2mht(s(j3,j4),t(j1,j2,j3),s(j5,j6),s(j1,j2))\n\n      + 0.5*zb(j1,j2)\n      *(pow(zab2(j4,j1,j2,j3)*za(j3,j5) + zab2(j4,j1,j2,j4)*za(j4,j5),2)\n      - s(j1,j2)*s(j3,j4)*pow(za(j4,j5),2))\n      /(za(j1,j2)*zb(j3,j4)*za(j5,j6)*zab2(j4,j2,j3,j1)\n      *zab2(j4,j1,j2,j3))*i3m(s(j1,j2),s(j3,j4),s(j5,j6))\n\n      - 2.0*za(j1,j3)*zab2(j3,j1,j2,j6)\n      /(za(j1,j2)*zb(j5,j6)*zab2(j1,j2,j3,j4))\n      *(zb21b(j6,j2,j3,j1,j2)/t(j1,j2,j3)\n      *L0(-s(j2,j3),-t(j1,j2,j3))/t(j1,j2,j3)\n      + zab(j3,j4,j6)/za(j2,j3)\n      *L0(-s(j5,j6),-t(j1,j2,j3))/t(j1,j2,j3));\n\n//    +flip1\n  return result;\n}\n\nstd::complex<double> FPMFcc(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  std::complex<double> result =\n      FPMFcc_unsym(j1,j2,j3,j4,j5,j6,za,zb)\n    + FPMFcc_unsym(j4,j3,j2,j1,j6,j5,zb,za);\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> fpmfcc_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return FPMFcc(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
