content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq10.4\n#include <BDK.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstatic std::complex<double> FFPPcc1(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  return\n      -2.0*za(j5,j2)*zab(j5,j4,j3)\n      /(za(j3,j4)*za(j4,j1)*za(j5,j6));\n}\n\nstatic std::complex<double> FFPPcc2(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n\n  return\n      +2.0*za(j2,j5)*za(j1,j5)*zab2(j2,j3,j4,j1)\n      /(za(j2,j3)*za(j3,j4)*za(j4,j1)*za(j5,j6));\n}\n\nstd::complex<double> FFPPcc(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  double s123 = t(j1,j2,j3);\n  double s234 = t(j2,j3,j4);\n\n  std::complex<double> result =\n      za(j2,j5)*(za(j1,j2)*za(j4,j5) - za(j2,j4)*za(j1,j5))\n      /(za(j2,j3)*za(j3,j4)*pow(za(j4,j1),2)*za(j5,j6))\n      *Lsm1_2me(s123,s234,s(j2,j3),s(j5,j6))\n\n      + za(j2,j5)*(za(j2,j3)*za(j1,j5) - za(j1,j2)*za(j3,j5))\n      /(za(j2,j3)*za(j3,j4)*za(j4,j1)*za(j1,j3)*za(j5,j6))\n      *Lsm1(-s(j1,j2),-s123,-s(j2,j3),-s123)\n\n      - za(j2,j5)*(za(j2,j3)*za(j4,j5) + za(j2,j4)*za(j3,j5))\n      /(za(j2,j3)*pow(za(j3,j4),2)*za(j4,j1)*za(j5,j6))\n      *Lsm1_2me(t(j1,j2,j4),s123,s(j1,j2),s(j5,j6))\n\n      - pow(za(j5,j2),2)/(za(j2,j3)*za(j3,j4)*za(j4,j1)*za(j5,j6))\n      *(Lsm1(-s(j1,j4),-t(j1,j2,j4),-s(j1,j2),-t(j1,j2,j4))\n      + Lsm1_2me(t(j1,j3,j4),t(j1,j2,j4),s(j1,j4),s(j5,j6)))\n\n      + FFPPcc1(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s(j2,j3))/s(j2,j3)\n      + FFPPcc2(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s(j5,j6))/s(j5,j6);\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> ffppcc_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return FFPPcc(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
