content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq10.12\n#include <BDK.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstatic std::complex<double> FFMPsc1(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n\n  return\n      +0.5*za(j4,j5)*zab2(j3,j1,j2,j4)*zab2(j5,j2,j3,j4)\n      /(s(j3,j4)*za(j5,j6)*zab2(j1,j3,j4,j2)*zab2(j4,j1,j2,j3));\n}\n\nstatic std::complex<double> FFMPsc_unsym(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  std::complex<double> result =\n      Master2(j1,j2,j3,j4,j5,j6,za,zb)\n    + Master3(j1,j2,j3,j4,j5,j6,za,zb)\n//    ffmp_scalar_lzero_1\n    + FFMPsc1(j1,j2,j3,j4,j5,j6,za,zb)*lnrat(-s(j1,j2),-s(j5,j6))\n//    ffmp_poly_1\n    - 0.5*za(j3,j5)*(za(j2,j3)*za(j4,j5) - za(j2,j5)*za(j3,j4))\n    /(za(j1,j4)*za(j3,j4)*za(j5,j6)*zab2(j4,j1,j2,j3))\n    + 0.5*zb(j2,j4)*za(j3,j5)\n    /(zb(j2,j3)*za(j5,j6)*zab2(j1,j3,j4,j2))\n    *(za(j3,j5)/za(j3,j4) + zab2(j5,j2,j3,j4)/t(j2,j3,j4));\n//    +flip2\n\n  return result;\n}\n\nstd::complex<double> FFMPsc(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  std::complex<double> result =\n      FFMPsc_unsym(j1,j2,j3,j4,j5,j6,za,zb)\n    + FFMPsc_unsym(j2,j1,j4,j3,j6,j5,zb,za);\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> ffmpsc_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return FFMPsc(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
