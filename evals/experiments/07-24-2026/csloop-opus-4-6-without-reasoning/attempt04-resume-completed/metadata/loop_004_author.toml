content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq.7.3\n#include <BDK.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstd::complex<double> Master2(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  // Statement functions as lambdas\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zba2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return zb(i1,i2)*za(i2,i4) + zb(i1,i3)*za(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n  auto zba = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return zb(i1,i2)*za(i2,i3);\n  };\n  auto zb12b = [&](int i1, int i2, int i3, int i4, int i5) -> std::complex<double> {\n    return zb(i1,i2)*zab2(i2,i3,i4,i5);\n  };\n  auto za12a = [&](int i1, int i2, int i3, int i4, int i5) -> std::complex<double> {\n    return za(i1,i2)*zba2(i2,i3,i4,i5);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  double delta12 = s(j1,j2) - s(j3,j4) - s(j5,j6);\n  double delta34 = s(j3,j4) - s(j5,j6) - s(j1,j2);\n  double delta56 = s(j5,j6) - s(j1,j2) - s(j3,j4);\n  double Delta3 = pow(s(j1,j2),2) + pow(s(j3,j4),2) + pow(s(j5,j6),2)\n      - 2.0*s(j1,j2)*s(j3,j4) - 2.0*s(j3,j4)*s(j5,j6) - 2.0*s(j5,j6)*s(j1,j2);\n\n  std::complex<double> M2bit1_val = t(j1,j2,j3)*zb(j4,j6)*zab(j5,j4,j1)\n      /(zb(j2,j3)*zab2(j4,j1,j2,j3));\n  std::complex<double> M2bit2_val =\n      -zab(j3,j2,j1)*pow(zab2(j5,j1,j2,j3),2)\n      /(zb(j2,j3)*za(j5,j6)*pow(zab2(j4,j1,j2,j3),2));\n  std::complex<double> M2bit3_val =\n      -zab(j5,j4,j1)*zab2(j5,j1,j2,j3)*t(j1,j2,j3)\n      /(zb(j2,j3)*za(j5,j6)*pow(zab2(j4,j1,j2,j3),2));\n\n  std::complex<double> result = Master2a(j1,j2,j3,j4,j5,j6,za,zb);\n\n  result = result\n      + zab2(j4,j2,j3,j1)*pow(zab2(j5,j1,j2,j3),2)\n      /(zb(j2,j3)*za(j5,j6)*pow(zab2(j4,j1,j2,j3),3))\n      *Lsm1_2mh(s(j3,j4),t(j1,j2,j3),s(j1,j2),s(j5,j6))\n\n      + zb(j1,j2)/(zb(j2,j3)*zab2(j4,j1,j2,j3))\n      *(3.0*za(j1,j2)*zb(j3,j4)*zab2(j3,j1,j2,j4)*zab2(j5,j1,j2,j6)\n      /pow(Delta3,2)\n      *(zab(j4,j2,j1)*delta12 - zab(j4,j3,j1)*delta34)\n\n      - 1.0/Delta3\n      *(zab(j2,j1,j3)*zab2(j3,j1,j2,j4)*za(j4,j5)*zb(j3,j6)\n      /zab2(j4,j1,j2,j3)*(t(j1,j2,j4) - t(j1,j2,j3))\n      + za(j2,j3)*zb(j4,j6)\n      *(zab(j5,j4,j3)*delta34 - zab(j5,j6,j3)*delta56)\n\n      + zab2(j3,j1,j2,j4)*(zab(j2,j4,j3)*zab2(j5,j1,j2,j6)\n      + 3.0*zab(j2,j1,j3)*zab(j5,j4,j6))\n\n      - zab(j2,j1,j4)*za(j3,j5)*(zb12b(j6,j4,j1,j2,j3)\n      + 2.0*zba(j6,j5,j4)*zb(j4,j3)\n      + zb(j3,j6)*delta12))\n      + za12a(j2,j3,j1,j2,j5)*zb(j4,j6)/t(j1,j2,j3))\n      *i3m(s(j1,j2),s(j3,j4),s(j5,j6))\n\n      + M2bit1_val*L1(-s(j5,j6),-t(j1,j2,j3))/pow(t(j1,j2,j3),2)\n      + M2bit2_val*L0(-t(j1,j2,j3),-s(j1,j2))/s(j1,j2)\n      + M2bit3_val*L0(-t(j1,j2,j3),-s(j5,j6))/s(j5,j6)\n\n      - 0.5*(zab(j4,j2,j1)*delta12 - zab(j4,j3,j1)*delta34)\n      /(zb(j2,j3)*za(j3,j4)*zab2(j4,j1,j2,j3)*Delta3)\n      *(za(j3,j4)*pow(zb(j4,j6),2)/zb(j5,j6)\n       + pow(za(j3,j5),2)*zb(j3,j4)/za(j5,j6))\n\n      - za(j3,j5)*zb(j4,j6)\n      *(zb(j1,j3)*delta56 - 2.0*zba(j1,j2,j4)*zb(j4,j3))\n      /(zb(j2,j3)*zab2(j4,j1,j2,j3)*Delta3);\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> master2_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return Master2(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
