content = "!\n!  SPDX-License-Identifier: GPL-3.0-or-later\n!  Copyright (C) 2019-2022, respective authors of MCFM.\n!\n      function FFPPsc(j1,j2,j3,j4,j5,j6,za,zb)\n      use types\n      use mxpart_mod\n      implicit none\n      complex(dp):: za(mxpart,mxpart),zb(mxpart,mxpart)\n      complex(dp):: FFPPsc\n      integer:: j1,j2,j3,j4,j5,j6\n\n      interface\n        function ffppsc_wrapper(j1,j2,j3,j4,j5,j6,za,zb) bind(C)\n          use iso_c_binding\n          complex(c_double_complex) :: ffppsc_wrapper\n          integer(c_int), value :: j1,j2,j3,j4,j5,j6\n          complex(c_double_complex) :: za(*),zb(*)\n        end function\n      end interface\n\n      FFPPsc = ffppsc_wrapper(j1,j2,j3,j4,j5,j6,za,zb)\n      return\n      end\n"
