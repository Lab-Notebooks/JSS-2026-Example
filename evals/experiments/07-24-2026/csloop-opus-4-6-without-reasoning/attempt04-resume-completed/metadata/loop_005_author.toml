content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq10.6\n#include <BDK.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstatic std::complex<double> FFPPsc1(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  return\n      +((za(j4,j1)*za(j5,j2)-za(j2,j4)*za(j5,j1))*zab(j5,j4,j3)\n       /(za(j3,j4)*pow(za(j4,j1),2)*za(j5,j6)));\n}\n\nstatic std::complex<double> FFPPsc2(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  return\n      -0.5*pow(zab(j5,j4,j3),2)*za(j3,j2)\n      /(za(j3,j4)*za(j4,j1)*za(j5,j6));\n}\n\nstatic std::complex<double> FFPPsc3(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      -0.5*pow(za(j5,j2),2)\n      /(za(j2,j3)*za(j3,j4)*za(j4,j1)*za(j5,j6));\n}\n\nstatic std::complex<double> FFPPsc4(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  return\n      +(za(j2,j4)*pow(za(j5,j1),2)*zab2(j2,j3,j4,j1)\n      /(za(j2,j3)*za(j3,j4)*pow(za(j4,j1),2)*za(j5,j6))\n      -za(j5,j2)*zab(j2,j1,j6)/(za(j2,j3)*za(j3,j4)*za(j4,j1)));\n}\n\nstatic std::complex<double> FFPPsc5(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  return\n      -0.5*za(j5,j6)*pow(zab(j2,j1,j6),2)\n      /(za(j2,j3)*za(j3,j4)*za(j4,j1));\n}\n\nstatic std::complex<double> FFPPsc6(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n\n  return\n      +za(j2,j3)*zab2(j5,j1,j2,j3)*za(j3,j5)\n      /(pow(za(j3,j4),2)*za(j1,j3)*za(j5,j6));\n}\n\nstatic std::complex<double> FFPPsc7(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n\n  return\n      - pow(za(j1,j2),2)*zab2(j5,j2,j3,j1)*za(j1,j5)\n      /(za(j2,j3)*pow(za(j4,j1),2)*za(j1,j3)*za(j5,j6));\n}\n\nstatic std::complex<double> FFPPsc8(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  return\n      +(za(j2,j4)*zab(j5,j4,j6)/(pow(za(j3,j4),2)*za(j4,j1))\n      -(2.0*za(j4,j1)*za(j5,j2)+za(j5,j1)*za(j2,j4))*zab(j2,j4,j6)\n      /(za(j2,j3)*za(j3,j4)*pow(za(j4,j1),2))\n      +za(j5,j2)*za(j5,j4)*zab2(j2,j1,j3,j4)\n      /(za(j2,j3)*za(j3,j4)*za(j4,j1)*za(j5,j6)));\n}\n\nstatic std::complex<double> FFPPsc9(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      -pow(za(j5,j2),2)/(za(j2,j3)*za(j3,j4)*za(j4,j1)*za(j5,j6));\n}\n\nstatic std::complex<double> FFPPsc10(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  return\n      -za(j5,j6)*pow(zab(j2,j4,j6),2)\n      /(za(j2,j3)*za(j3,j4)*za(j4,j1));\n}\n\nstatic std::complex<double> FFPPsc11(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n\n  return\n      -za(j2,j4)*za(j5,j4)*zab2(j5,j1,j2,j4)\n      /(pow(za(j3,j4),2)*za(j4,j1)*za(j5,j6));\n}\n\nstatic std::complex<double> FFPPsc12(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  return\n      -za(j2,j4)*zab(j5,j3,j6)/(pow(za(j3,j4),2)*za(j4,j1));\n}\n\nstatic std::complex<double> FFPPsc13(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      -za(j2,j3)*pow(zb(j3,j6),2)*za(j5,j6)\n      /(za(j3,j4)*za(j4,j1));\n}\n\nstatic std::complex<double> FFPPsc14(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      +za(j5,j1)*za(j5,j2)/(za(j3,j4)*za(j4,j1)*za(j1,j3)*za(j5,j6));\n}\n\nstatic std::complex<double> FFPPsc15(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  return\n      +za(j5,j1)*za(j5,j2)/(za(j4,j1)*za(j1,j3)*za(j5,j6))\n      *(-za(j1,j2)/(za(j2,j3)*za(j4,j1)));\n}\n\nstd::complex<double> FFPPsc(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  double s123 = t(j1,j2,j3);\n  double s124 = t(j1,j2,j4);\n  double s234 = t(j2,j3,j4);\n  double s12 = s(j1,j2);\n  double s23 = s(j2,j3);\n  double s56 = s(j5,j6);\n\n  std::complex<double> result =\n      -pow(za(j2,j4),2)*pow(za(j5,j1),2)\n      /(za(j2,j3)*za(j3,j4)*pow(za(j4,j1),3)*za(j5,j6))\n      *Lsm1_2me(s123,s234,s23,s56)\n\n      -za(j2,j3)*pow(za(j5,j1),2)\n      /(za(j3,j4)*za(j4,j1)*pow(za(j1,j3),2)*za(j5,j6))\n      *Lsm1(-s12,-s123,-s23,-s123)\n\n      -za(j2,j3)*pow(za(j5,j4),2)/(pow(za(j3,j4),3)*za(j4,j1)*za(j5,j6))\n      *Lsm1_2me(s124,s123,s12,s56)\n\n      +FFPPsc1(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s23)/s23\n      +FFPPsc2(j1,j2,j3,j4,j5,j6,za,zb)*L1(-s23,-s234)/pow(s234,2)\n      +FFPPsc3(j1,j2,j3,j4,j5,j6,za,zb)*lnrat(-s234,-s56)\n      +FFPPsc4(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s56)/s56\n      +FFPPsc5(j1,j2,j3,j4,j5,j6,za,zb)*L1(-s234,-s56)/pow(s56,2)\n      +FFPPsc6(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s123,-s12)/s12\n      +FFPPsc7(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s123,-s23)/s23\n      +FFPPsc8(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s123,-s56)/s56\n      +FFPPsc9(j1,j2,j3,j4,j5,j6,za,zb)*lnrat(-s123,-s56)\n      +FFPPsc10(j1,j2,j3,j4,j5,j6,za,zb)*L1(-s123,-s56)/pow(s56,2)\n      +FFPPsc11(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s124,-s12)/s12\n      +FFPPsc12(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s124,-s56)/s56\n      +FFPPsc13(j1,j2,j3,j4,j5,j6,za,zb)*L1(-s124,-s56)/pow(s56,2)\n      +FFPPsc14(j1,j2,j3,j4,j5,j6,za,zb)*lnrat(-s12,-s56)\n      +FFPPsc15(j1,j2,j3,j4,j5,j6,za,zb)*lnrat(-s23,-s56)\n\n      +0.5*(\n      zb(j3,j4)*zab2(j4,j1,j3,j6)*zab2(j2,j3,j4,j6)\n      /(za(j3,j4)*za(j4,j1)*s234*t(j1,j3,j4)*zb(j5,j6))\n\n      +zb(j3,j4)*za(j5,j2)*zab(j5,j1,j3)\n      /(za(j4,j1)*s234*t(j1,j3,j4)*za(j5,j6))\n\n      +za(j5,j2)*zab(j5,j4,j3)\n      /(za(j3,j4)*za(j4,j1)*s234*za(j5,j6))\n\n      +pow(za(j2,j5),2)/(za(j2,j3)*za(j3,j4)*za(j4,j1)*za(j5,j6)));\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> ffppsc_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return FFPPsc(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
