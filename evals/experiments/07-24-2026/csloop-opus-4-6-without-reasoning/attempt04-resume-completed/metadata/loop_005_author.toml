content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq9.14\n#include <BDK.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstatic std::complex<double> FPFMsc1(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  return\n      +0.5*zab(j5,j1,j2)/(zb(j3,j4)*zab2(j1,j2,j3,j4))\n      *zab2(j5,j3,j4,j2)/za(j5,j6);\n}\n\nstatic std::complex<double> FPFMsc2(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zba2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return zb(i1,i2)*za(i2,i4) + zb(i1,i3)*za(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n  auto zb21b = [&](int i1, int i2, int i3, int i4, int i5) -> std::complex<double> {\n    return zba2(i1,i2,i3,i4)*zb(i4,i5);\n  };\n\n  return\n      +0.5*zab(j5,j1,j2)/(zb(j3,j4)*zab2(j1,j2,j3,j4))\n      *zb21b(j2,j3,j4,j1,j6);\n}\n\nstatic std::complex<double> FPFMsc3(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  return\n      +0.5*zb(j2,j3)*za(j3,j4)*zab2(j5,j2,j3,j4)\n      /(zb(j3,j4)*za(j5,j6)*zab2(j1,j2,j3,j4))\n      *zab2(j5,j3,j4,j2)/t(j2,j3,j4);\n}\n\nstatic std::complex<double> FPFMsc4(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  return\n      +0.5*zb(j2,j3)*za(j3,j4)*zab2(j5,j2,j3,j4)\n      /(zb(j3,j4)*za(j5,j6)*zab2(j1,j2,j3,j4))\n      *zab(j5,j4,j2);\n}\n\nstatic std::complex<double> FPFMsc5(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zba2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return zb(i1,i2)*za(i2,i4) + zb(i1,i3)*za(i3,i4);\n  };\n  auto zb21b = [&](int i1, int i2, int i3, int i4, int i5) -> std::complex<double> {\n    return zba2(i1,i2,i3,i4)*zb(i4,i5);\n  };\n\n  return\n      -0.5*zb(j1,j2)/(zb(j1,j4)*zab2(j1,j2,j3,j4)*zab2(j2,j1,j4,j3))\n      *(zab2(j5,j3,j4,j1)*za(j1,j5)/za(j5,j6)\n      -zb21b(j6,j1,j2,j4,j6)/zb(j5,j6));\n}\n\nstd::complex<double> FPFMsc(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  double s234 = t(j2,j3,j4);\n  double s23 = s(j2,j3);\n  double s56 = s(j5,j6);\n\n  std::complex<double> result =\n      za(j1,j3)/za(j2,j3)*Master2(j3,j2,j1,j4,j6,j5,zb,za)\n      +za(j1,j4)/za(j2,j4)*Master3(j3,j2,j1,j4,j6,j5,zb,za)\n\n      +FPFMsc1(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s56)/s56\n      +FPFMsc2(j1,j2,j3,j4,j5,j6,za,zb)*L1(-s56,-s234)/pow(s234,2)\n      +FPFMsc3(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s23)/s23\n      +FPFMsc4(j1,j2,j3,j4,j5,j6,za,zb)*L1(-s234,-s23)/pow(s23,2)\n      +FPFMsc5(j1,j2,j3,j4,j5,j6,za,zb)*lnrat(-s23,-s56)\n//    fpfm_poly\n      +0.5*(\n      -zb(j1,j2)*za(j1,j5)*za(j3,j5)\n      /(za(j2,j3)*zb(j3,j4)*za(j5,j6)*zab2(j1,j2,j3,j4))\n      -pow(zb(j1,j3),2)*pow(za(j3,j5),2)\n      /(zb(j1,j4)*za(j2,j3)*zb(j3,j4)*za(j5,j6)*zab2(j2,j1,j4,j3))\n      +zab(j4,j3,j1)*za(j1,j5)*za(j3,j5)\n      /(za(j2,j3)*za(j5,j6)*zab2(j1,j2,j3,j4)*zab2(j2,j1,j4,j3))\n\n      -za(j1,j3)*za(j3,j5)*za(j4,j5)\n      /(za(j1,j2)*za(j2,j3)*za(j5,j6)*zab2(j1,j2,j3,j4))\n      -s(j3,j4)*za(j1,j5)*za(j4,j5)\n      /(za(j1,j2)*za(j5,j6)*zab2(j1,j2,j3,j4)*zab2(j2,j1,j4,j3))\n      -zb(j1,j2)*za(j1,j5)*zab2(j5,j3,j4,j2)\n      /(zb(j3,j4)*za(j5,j6)*s234*zab2(j1,j2,j3,j4))\n\n      -za(j1,j3)*pow(zb(j1,j6),2)\n      /(zb(j1,j4)*za(j1,j2)*za(j2,j3)*zb(j3,j4)*zb(j5,j6))\n      +zab(j3,j4,j6)*zab2(j1,j2,j3,j6)\n      /(za(j1,j2)*za(j2,j3)*zb(j3,j4)*zb(j5,j6)*zab2(j1,j2,j3,j4))\n      -s(j1,j3)*zab(j3,j4,j6)*zb(j3,j6)\n      /(za(j2,j3)*zb(j3,j4)*zb(j5,j6)\n      *zab2(j1,j2,j3,j4)*zab2(j2,j1,j4,j3))\n\n      +za(j1,j4)*zab(j3,j4,j6)*zb(j3,j6)\n      /(za(j1,j2)*zb(j5,j6)*zab2(j1,j2,j3,j4)*zab2(j2,j1,j4,j3))\n      +zab(j3,j1,j6)*zb(j1,j2)*zb(j4,j6)\n      /(zb(j1,j4)*za(j2,j3)*zb(j3,j4)*zb(j5,j6)*zab2(j1,j2,j3,j4))\n      -zab2(j4,j1,j2,j6)*zb(j2,j6)*za(j2,j4)\n      /(za(j1,j2)*zb(j5,j6)*t(j1,j2,j4)*zab2(j2,j1,j4,j3)));\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> fpfmsc_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return FPFMsc(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
