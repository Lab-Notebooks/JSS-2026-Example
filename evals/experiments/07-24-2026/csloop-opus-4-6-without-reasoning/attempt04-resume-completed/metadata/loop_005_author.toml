content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq10.20\n#include <BDK.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstatic std::complex<double> FFPMsc1(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n\n  return\n      +zb(j1,j3)/(zb(j5,j6)*za(j1,j3)*zab2(j3,j1,j2,j4))\n      *(za(j1,j2)*pow(zab2(j3,j1,j2,j6),2)/zab2(j3,j1,j2,j4));\n}\n\nstatic std::complex<double> FFPMsc2_fn(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n\n  return\n      +zb(j1,j3)/(zb(j5,j6)*za(j1,j3)*zab2(j3,j1,j2,j4))\n      *(-za(j2,j3)*pow(zab2(j1,j2,j3,j6),2)/zab2(j1,j2,j3,j4));\n}\n\nstatic std::complex<double> FFPMsc3(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  return\n      +0.5*zb(j2,j3)*pow(za(j2,j4),2)/(za(j5,j6)*zb(j2,j4)*t(j2,j3,j4))\n      *(zb(j2,j3)*pow(zab2(j5,j2,j3,j4),2)/zab2(j1,j2,j3,j4));\n}\n\nstatic std::complex<double> FFPMsc4(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  return\n      +0.5*zb(j2,j3)*pow(za(j2,j4),2)/(za(j5,j6)*zb(j2,j4)*t(j2,j3,j4))\n      *(-zb(j3,j4)*pow(zab2(j5,j3,j4,j2),2)/zab2(j1,j3,j4,j2));\n}\n\nstatic std::complex<double> FFPMsc5(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  return\n      +za(j2,j4)*pow(zb(j4,j6)*t(j1,j2,j3),2)\n      /(zb(j5,j6)*zab2(j1,j2,j3,j4)*pow(zab2(j3,j1,j2,j4),2));\n}\n\nstatic std::complex<double> FFPMsc6(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  return\n      -pow(zb(j2,j3),2)*za(j2,j4)*pow(za(j1,j5),2)*t(j2,j3,j4)\n      /(za(j5,j6)*zab2(j1,j2,j3,j4)*pow(zab2(j1,j3,j4,j2),2));\n}\n\nstatic std::complex<double> FFPMsc7(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  return\n      +0.5*zb(j1,j3)*zb(j2,j3)*pow(za(j1,j5),2)\n      *t(j2,j3,j4)*zab2(j1,j2,j4,j3)\n      /(zb(j3,j4)*za(j5,j6)*zab2(j1,j2,j3,j4)*zab2(j1,j3,j4,j2))\n      *zb(j1,j3)/zb(j2,j3);\n}\n\nstatic std::complex<double> FFPMsc8(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  return\n      +0.5*zb(j1,j3)*zb(j2,j3)*pow(za(j1,j5),2)\n      *t(j2,j3,j4)*zab2(j1,j2,j4,j3)\n      /(zb(j3,j4)*za(j5,j6)*zab2(j1,j2,j3,j4)*zab2(j1,j3,j4,j2))\n      *(-2.0/zab2(j1,j3,j4,j2));\n}\n\nstatic std::complex<double> FFPMsc9(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  return\n      +0.5*zb(j1,j3)*zb(j4,j6)\n      /(zab2(j1,j2,j3,j4)*zab2(j3,j1,j4,j2)*zab2(j3,j1,j2,j4))\n      *(za(j1,j3)*za(j4,j5)\n      +(zab2(j3,j1,j4,j6)*t(j1,j2,j3)-zab2(j3,j1,j2,j6)*t(j1,j3,j4))\n      /(zb(j1,j4)*zb(j5,j6)));\n}\n\nstatic std::complex<double> FFPMsc10(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zba2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return zb(i1,i2)*za(i2,i4) + zb(i1,i3)*za(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n  auto zba = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return zb(i1,i2)*za(i2,i3);\n  };\n  auto zb21b = [&](int i1, int i2, int i3, int i4, int i5) -> std::complex<double> {\n    return zba2(i1,i2,i3,i4)*zb(i4,i5);\n  };\n\n  double deltat14 = s(j1,j4) - s(j2,j3) - s(j5,j6);\n  double deltat23 = s(j2,j3) - s(j5,j6) - s(j1,j4);\n  double deltat56 = s(j5,j6) - s(j1,j4) - s(j2,j3);\n  double Deltat3 = pow(s(j1,j4),2) + pow(s(j2,j3),2) + pow(s(j5,j6),2)\n      - 2.0*s(j1,j4)*s(j2,j3) - 2.0*s(j2,j3)*s(j5,j6) - 2.0*s(j5,j6)*s(j1,j4);\n\n  return\n      +(3.0*zb(j2,j3)*zab2(j2,j3,j4,j1)/(zab2(j3,j1,j2,j4)*pow(Deltat3,2))\n      *(za(j4,j5)*(zab(j2,j3,j6)*deltat23-zab(j2,j5,j6)*deltat56)\n      -za(j1,j4)*zb(j1,j6)\n      *(za(j2,j5)*deltat14 -2.0*zab(j2,j3,j6)*za(j6,j5)))\n\n      +0.5/(zab2(j3,j1,j2,j4)*Deltat3)\n      *((-za(j2,j5)*za(j4,j5)/za(j5,j6)\n      +zb(j1,j6)*zab2(j2,j1,j4,j6)/(zb(j1,j4)*zb(j5,j6)))\n      *(zb(j1,j3)*deltat23-zb21b(j1,j5,j6,j2,j3))\n\n      -2.0*zb(j3,j6)*zab2(j2,j3,j4,j1)/(zb(j1,j4)*zb(j5,j6))\n      *(zb(j1,j6)*deltat23-2.0*zba(j1,j4,j5)*zb(j5,j6))\n      -4.0*zab(j4,j1,j3)*zb(j1,j6)*za(j2,j5)));\n}\n\nstatic std::complex<double> FFPMsc11(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n\n  return\n      -0.5*za(j3,j5)*zab2(j4,j1,j2,j3)*zab2(j5,j2,j4,j3)\n      /(s(j3,j4)*za(j5,j6)*zab2(j1,j3,j4,j2)*zab2(j3,j1,j2,j4));\n}\n\nstatic std::complex<double> FFPMsc_unsym(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zba2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return zb(i1,i2)*za(i2,i4) + zb(i1,i3)*za(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n  auto zba = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return zb(i1,i2)*za(i2,i3);\n  };\n  auto za12a = [&](int i1, int i2, int i3, int i4, int i5) -> std::complex<double> {\n    return za(i1,i2)*zba2(i2,i3,i4,i5);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  double deltat14 = s(j1,j4) - s(j2,j3) - s(j5,j6);\n  double deltat56 = s(j5,j6) - s(j1,j4) - s(j2,j3);\n  double delta12 = s(j1,j2) - s(j5,j6) - s(j3,j4);\n  double delta56 = s(j5,j6) - s(j1,j2) - s(j3,j4);\n  double Delta3 = pow(s(j1,j2),2) + pow(s(j3,j4),2) + pow(s(j5,j6),2)\n      - 2.0*s(j1,j2)*s(j3,j4) - 2.0*s(j3,j4)*s(j5,j6) - 2.0*s(j5,j6)*s(j1,j2);\n  double Deltat3 = pow(s(j1,j4),2) + pow(s(j2,j3),2) + pow(s(j5,j6),2)\n      - 2.0*s(j1,j4)*s(j2,j3) - 2.0*s(j2,j3)*s(j5,j6) - 2.0*s(j5,j6)*s(j1,j4);\n\n  double s123 = t(j1,j2,j3);\n  double s234 = t(j2,j3,j4);\n  double s12 = s(j1,j2);\n  double s23 = s(j2,j3);\n  double s34 = s(j3,j4);\n  double s56 = s(j5,j6);\n\n  std::complex<double> result =\n      zb(j2,j4)*zab2(j3,j2,j4,j1)\n      /(zb(j1,j4)*zab2(j3,j1,j2,j4))\n      *Master2(j1,j4,j2,j3,j5,j6,za,zb)\n\n      -pow(zb(j2,j3),2)*pow(za(j2,j4),2)*pow(zab2(j5,j2,j3,j4),2)\n      /(za(j5,j6)*zb(j2,j4)*s234*zab2(j1,j2,j3,j4))\n      *Ls1(-s23,-s234,-s34,-s234)\n      /pow(s234,2)\n\n      +pow(za(j2,j3)*zb(j4,j6)*s123,2)\n      /(za(j2,j3)*zb(j5,j6)*zab2(j1,j2,j3,j4)*pow(zab2(j3,j1,j2,j4),3))\n      *Lsm1_2mh(s34,s123,s12,s56)\n\n      -pow(zb(j2,j3)*za(j1,j5),2)*s234*zab2(j1,j2,j4,j3)\n      /(zb(j3,j4)*za(j5,j6)*zab2(j1,j2,j3,j4)*pow(zab2(j1,j3,j4,j2),3))\n      *Lsm1_2mh(s12,s234,s34,s56)\n\n      +pow(za(j2,j3)*zab2(j1,j2,j3,j6),2)\n      /(za(j2,j3)*zb(j5,j6)*pow(za(j1,j3),2)\n      *zab2(j1,j2,j3,j4)*zab2(j3,j1,j2,j4))\n      *Lsm1(-s12,-s123,-s23,-s123)\n\n      +FFPMscT(j1,j2,j3,j4,j5,j6,za,zb)*i3m(s12,s34,s56)\n     