content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq9.10\n#include <BDK.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstatic std::complex<double> FPFMcc1(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  return\n      -2.0*zb(j1,j2)*za(j1,j4)*zab2(j2,j1,j4,j6)*zab2(j4,j1,j2,j6)\n      /(za(j1,j2)*zb(j5,j6)*t(j1,j2,j4)*zab2(j2,j1,j4,j3));\n}\n\nstatic std::complex<double> FPFMcc2(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  return\n      +2.0*zb(j1,j6)*zab2(j1,j3,j4,j2)*zab2(j5,j3,j4,j2)\n      /(zb(j3,j4)*t(j2,j3,j4)*zab2(j1,j2,j3,j4));\n}\n\nstatic std::complex<double> FPFMcc3(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  return\n      +2.0*zab(j5,j4,j2)*zab2(j5,j3,j4,j2)\n      /(zb(j3,j4)*za(j5,j6)*zab2(j1,j2,j3,j4));\n}\n\nstatic std::complex<double> FPFMcc4(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n\n  return\n      +2.0*zab(j4,j3,j6)*zab2(j4,j1,j2,j6)\n      /(za(j1,j2)*zb(j5,j6)*zab2(j2,j1,j4,j3));\n}\n\nstatic std::complex<double> FPFMcc5(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  return\n      -2.0*pow(zab2(j5,j3,j4,j2),2)\n      /(zb(j3,j4)*za(j5,j6)*t(j2,j3,j4)*zab2(j1,j2,j3,j4));\n}\n\nstd::complex<double> FPFMcc(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  double s124 = t(j1,j2,j4);\n  double s234 = t(j2,j3,j4);\n\n  std::complex<double> result =\n      za(j1,j3)*pow(zab2(j3,j1,j2,j6),2)\n      /(za(j1,j2)*za(j2,j3)*zb(j5,j6)\n      *zab2(j1,j2,j3,j4)*zab2(j3,j1,j2,j4))\n      *Lsm1_2mh(s(j3,j4),t(j1,j2,j3),s(j1,j2),s(j5,j6))\n//    fpfm_gf_b4\n      +(pow(zab2(j5,j3,j4,j2),2)\n      /(zb(j3,j4)*za(j5,j6)*s234*zab2(j1,j2,j3,j4))\n      -pow(za(j3,j4)*zb(j1,j6),2)\n      /(za(j2,j3)*zb(j5,j6)*s234*zab2(j2,j3,j4,j1)))\n      *Lsm1_2mh(s(j1,j2),s234,s(j3,j4),s(j5,j6))\n//    fpfm_gf_b3a\n      +(za(j1,j3)*za(j1,j3)*za(j1,j3)*pow(zb(j4,j6)*t(j1,j2,j3),2)\n      /(za(j1,j2)*za(j2,j3)*zb(j5,j6)\n      *pow(zab2(j1,j2,j3,j4),3)*zab2(j3,j1,j2,j4))\n      -za(j1,j3)*pow(zab2(j1,j2,j3,j6),2)*zab2(j3,j1,j2,j4)\n      /(za(j1,j2)*za(j2,j3)*zb(j5,j6)*pow(zab2(j1,j2,j3,j4),3)))\n      *Lsm1_2mh(s(j1,j4),t(j1,j2,j3),s(j2,j3),s(j5,j6))\n//    fpfm_gf_b1a\n      -(pow(zab2(j2,j1,j4,j6)*zab2(j4,j1,j2,j3),2)\n      /(za(j1,j2)*zb(j5,j6)*s124*pow(zab2(j2,j1,j4,j3),3))\n      +pow(zb(j1,j2)*za(j3,j5),2)\n      /(zb(j1,j4)*za(j5,j6)*s124*zab2(j3,j1,j2,j4))\n      -pow(za(j2,j4)*zb(j3,j6),2)*s124\n      /(za(j1,j2)*zb(j5,j6)*pow(zab2(j2,j1,j4,j3),3)))\n      *Lsm1_2mh(s(j2,j3),s124,s(j1,j4),s(j5,j6))\n//    fpfm_gf_b5\n      +za(j1,j3)*pow(zab2(j3,j1,j2,j6),2)\n      /(za(j1,j2)*za(j2,j3)*zb(j5,j6)\n      *zab2(j1,j2,j3,j4)*zab2(j3,j1,j2,j4))\n      *Lsm1(-s(j1,j2),-t(j1,j2,j3),-s(j2,j3),-t(j1,j2,j3))\n//    fpfm_gf_b1\n      +pow(zab2(j5,j3,j4,j2),2)\n      /(zb(j3,j4)*za(j5,j6)*zab2(j1,j2,j3,j4))\n      *Lsm1(-s(j2,j3),-s234,-s(j3,j4),-s234)\n      /s234\n//    fpfm_gf_b5a\n      -pow(zb(j1,j2)*za(j3,j5),2)\n      /(za(j5,j6)*zb(j1,j4)*zab2(j3,j1,j2,j4))\n      *Lsm1(-s(j1,j4),-s124,-s(j1,j2),-s124)\n      /s124\n//    fpfm_gf_3m\n      +FPFMccT(j1,j2,j3,j4,j5,j6,za,zb)\n      *i3m(s(j1,j2),s(j3,j4),s(j5,j6))\n      +FPFMccTtilde(j1,j2,j3,j4,j5,j6,za,zb)\n      *i3m(s(j1,j4),s(j2,j3),s(j5,j6))\n//    master function terms\n      -Master1(j1,j4,j2,j3,j5,j6,za,zb)\n      -Master1(j3,j2,j4,j1,j6,j5,zb,za)\n//    fpfm_gf_lzero_terms\n      +FPFMcc1(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s124,-s(j1,j4))/s(j1,j4)\n      +FPFMcc2(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s(j5,j6))/s(j5,j6)\n      +FPFMcc3(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s234,-s(j2,j3))/s(j2,j3)\n      +FPFMcc4(j1,j2,j3,j4,j5,j6,za,zb)*L0(-s124,-s(j5,j6))/s(j5,j6)\n      +FPFMcc5(j1,j2,j3,j4,j5,j6,za,zb)*lnrat(-s(j2,j3),-s(j5,j6));\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> fpfmcc_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return FPFMcc(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
