content = "\nfunction FMPFsc(j1,j2,j3,j4,j5,j6,za,zb) result(res)\n  use, intrinsic :: iso_c_binding\n  use mxpart_mod\n  implicit none\n\n  complex(c_double_complex) :: res\n  integer(c_int), intent(in) :: j1, j2, j3, j4, j5, j6\n  complex(c_double_complex), dimension(mxpart,mxpart), intent(in) :: za, zb\n\n  interface\n    function fmpfsc_wrapper(j1,j2,j3,j4,j5,j6,za,zb) bind(C, name=\"fmpfsc_wrapper\")\n      import :: c_int, c_double_complex\n      integer(c_int), value :: j1, j2, j3, j4, j5, j6\n      complex(c_double_complex), dimension(*) :: za, zb\n      complex(c_double_complex) :: fmpfsc_wrapper\n    end function fmpfsc_wrapper\n  end interface\n\n  res = fmpfsc_wrapper(j1,j2,j3,j4,j5,j6,za,zb)\nend function FMPFsc\n"
