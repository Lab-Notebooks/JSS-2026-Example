content = "//\n//  SPDX-License-Identifier: GPL-3.0-or-later\n//  Copyright (C) 2019-2022, respective authors of MCFM.\n//\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\n// Eq8.20\n#include <BDK.hpp>\n#include <Need.hpp>\n#include <complex>\n#include <cmath>\n#include <mxpart_mod.hpp>\n#include <sprods_com_mod.hpp>\n#include <FArray.hpp>\n\nusing namespace mxpart_mod;\nusing namespace sprods_com_mod;\n\nstatic std::complex<double> FMPFsc_unsym(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  // Statement functions as lambdas\n  auto zab2 = [&](int i1, int i2, int i3, int i4) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\n  };\n  auto zab = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return za(i1,i2)*zb(i2,i3);\n  };\n  auto zba = [&](int i1, int i2, int i3) -> std::complex<double> {\n    return zb(i1,i2)*za(i2,i3);\n  };\n  auto zb12b = [&](int i1, int i2, int i3, int i4, int i5) -> std::complex<double> {\n    return zb(i1,i2)*zab2(i2,i3,i4,i5);\n  };\n  auto t = [&](int i1, int i2, int i3) -> double {\n    return s(i1,i2) + s(i2,i3) + s(i3,i1);\n  };\n\n  double delta12 = s(j1,j2) - s(j3,j4) - s(j5,j6);\n  double delta34 = s(j3,j4) - s(j5,j6) - s(j1,j2);\n  double delta56 = s(j5,j6) - s(j1,j2) - s(j3,j4);\n  double Delta3 = pow(s(j1,j2),2) + pow(s(j3,j4),2) + pow(s(j5,j6),2)\n      - 2.0*s(j1,j2)*s(j3,j4) - 2.0*s(j3,j4)*s(j5,j6) - 2.0*s(j5,j6)*s(j1,j2);\n\n  std::complex<double> result =\n       za(j1,j2)*za(j2,j3)*pow(zb(j1,j3),2)*pow(zab2(j1,j2,j3,j6),2)\n      /(zb(j5,j6)*za(j1,j3)*t(j1,j2,j3)*zab2(j1,j2,j3,j4))\n      *(Ls1(-s(j1,j2),-t(j1,j2,j3),-s(j2,j3),-t(j1,j2,j3))\n      /pow(t(j1,j2,j3),2)\n      - 0.5*L1(-t(j1,j2,j3),-s(j2,j3))/pow(s(j2,j3),2))\n//     pmpm_scalar_b2\n      + za(j2,j3)*pow(zb(j4,j6),2)*t(j1,j2,j3)*zab2(j2,j1,j3,j4)\n      /(zb(j5,j6)*zab2(j1,j2,j3,j4)*pow(zab2(j3,j1,j2,j4),3))\n      *Lsm1_2mh(s(j3,j4),t(j1,j2,j3),s(j1,j2),s(j5,j6))\n//     Scalar three-mass triangle (D=6 form) pmpm_scalar_3m_1\n      + za(j1,j2)*zb(j4,j6)/(zab2(j1,j2,j3,j4)*Delta3)\n      *(3.0*zb(j3,j4)*za(j5,j6)*zab2(j2,j3,j4,j1)\n      *(zab(j3,j5,j6)*delta56 - zab(j3,j4,j6)*delta34)\n      *zab2(j4,j1,j2,j3)/(zab2(j3,j1,j2,j4)*Delta3)\n      + (3.0*zab(j5,j6,j4)*zab(j2,j3,j1)\n      - zab(j5,j3,j4)*zab2(j2,j3,j4,j1))\n      *zab2(j4,j1,j2,j3)/zab2(j3,j1,j2,j4)\n      - zb(j1,j3)*za(j2,j4)*zb(j3,j6)*za(j5,j6)\n      + zb(j1,j4)*za(j2,j3)*zab(j5,j6,j4)*(t(j1,j2,j3) - t(j1,j2,j4))\n      *zab2(j4,j1,j2,j3)/pow(zab2(j3,j1,j2,j4),2))\n      *i3m(s(j1,j2),s(j3,j4),s(j5,j6))\n//     L_0 terms: pmpm_scalar_lzero_1\n      + za(j2,j4)*pow(zb(j4,j6),2)*zab2(j2,j1,j3,j4)*t(j1,j2,j3)\n      /(zb(j5,j6)*zab2(j1,j2,j3,j4)*zab2(j3,j1,j2,j4))\n      *(-0.5*za(j2,j4)/za(j2,j3)*L1(-s(j5,j6),-t(j1,j2,j3))\n      /pow(t(j1,j2,j3),2)\n      + 1.0/zab2(j3,j1,j2,j4)\n      *L0(-s(j5,j6),-t(j1,j2,j3))/t(j1,j2,j3))\n      + zab(j2,j1,j3)*za(j3,j2)*pow(zb(j4,j6),2)*t(j1,j2,j3)\n       /(zb(j5,j6)*zab2(j1,j2,j3,j4)*pow(zab2(j3,j1,j2,j4),2))\n      *L0(-t(j1,j2,j3),-s(j1,j2))/s(j1,j2)\n      + 0.5*pow(zab(j2,j1,j3)*zab2(j3,j1,j2,j6),2)\n      /(zb(j5,j6)*za(j1,j3)*t(j1,j2,j3)*zab2(j3,j1,j2,j4))\n      *L1(-t(j1,j2,j3),-s(j1,j2))/pow(s(j1,j2),2)\n//     pmpm_scalar_lns12_1\n      + za(j1,j2)*zb(j4,j6)/zab2(j1,j2,j3,j4)*(\n       3.0*(zab(j5,j3,j4)*delta34 - zab(j5,j6,j4)*delta56)\n      *zab2(j2,j3,j4,j1)*zab2(j4,j1,j2,j3)\n      /(zab2(j3,j1,j2,j4)*pow(Delta3,2))\n      + 0.5/(za(j3,j4)*zb(j5,j6)*zab2(j3,j1,j2,j4)*Delta3)\n      *(-za(j2,j4)*delta12\n      *(zba(j6,j5,j3)*zb(j3,j1) + zb12b(j6,j4,j2,j3,j1))\n      + zab2(j2,j3,j4,j1)*zab2(j4,j1,j2,j3)\n      *(zab(j3,j4,j6) - zab(j3,j5,j6))\n      - zab2(j2,j3,j4,j1)*zab(j3,j4,j6)*delta34\n      *(t(j1,j2,j3) - t(j1,j2,j4))/zab2(j3,j1,j2,j4))\n      + 0.5*zb(j4,j6)*zab2(j2,j3,j4,j1)\n      /(zb(j5,j6)*pow(zab2(j3,j1,j2,j4),2)))*lnrat(-s(j1,j2),-s(j5,j6))\n//    pmpm_scalar_lns34_1\n      + zb(j4,j6)/(zab2(j1,j2,j3,j4)*zab2(j3,j1,j2,j4))\n      *(-3.0*za(j1,j2)*zb(j3,j4)*zab2(j2,j3,j4,j1)*zab2(j4,j1,j2,j3)\n      *(za(j3,j5)*delta12 - 2.0*zab(j3,j4,j6)*za(j6,j5))/pow(Delta3,2)\n      - 0.5/(zb(j1,j2)*zb(j5,j6)*Delta3)\n      *(zab2(j2,j3,j4,j1)*zab2(j4,j1,j2,j3)\n      *(zb(j4,j3)*zab2(j3,j1,j2,j6) + zb(j4,j6)*(delta56 - 2.0*s(j1,j2)))\n      - delta34*zab(j2,j4,j3)\n      *(zba(j6,j5,j3)*zb(j3,j1) + zb12b(j6,j4,j2,j3,j1))\n      - 2.0*zb(j4,j6)*t(j1,j2,j3)*(2.0*(zab(j2,j3,j1) - zab(j2,j4,j1))\n      *zab2(j4,j1,j2,j3)\n      + (t(j1,j2,j3) - t(j1,j2,j4))*(zb(j1,j3)*za(j2,j4)\n      + zb(j1,j4)*za(j2,j3)*zab2(j4,j1,j2,j3)/zab2(j3,j1,j2,j4))))\n      - 0.5*zb(j1,j3)*zab(j2,j4,j6)/(zb(j1,j2)*zb(j5,j6)))\n      *lnrat(-s(j3,j4),-s(j5,j6))\n//     pmpm_scalar_poly_1\n      + 0.5*zb(j4,j6)*zab2(j2,j3,j4,j1)*zab2(j4,j1,j2,j3)\n      *(zab(j3,j5,j6)*delta56 - zab(j3,j4,j6)*delta34)\n      /(zb(j1,j2)*za(j3,j4)*zb(j5,j6)*zab2(j1,j2,j3,j4)\n      *zab2(j3,j1,j2,j4)*Delta3)\n      - 0.5*zab(j2,j4,j6)\n      *(zba(j6,j5,j3)*zb(j3,j1) + zb12b(j6,j4,j2,j3,j1))\n      /(zb(j1,j2)*za(j3,j4)*zb(j5,j6)*zab2(j1,j2,j3,j4)\n      *zab2(j3,j1,j2,j4))\n      - 0.5*pow(zb(j1,j3)*zab2(j1,j2,j3,j6),2)\n      /(zb(j1,j2)*zb(j2,j3)*zb(j5,j6)*za(j1,j3)\n      *t(j1,j2,j3)*zab2(j1,j2,j3,j4));\n//    + flip1\n\n  return result;\n}\n\nstd::complex<double> FMPFsc(int j1, int j2, int j3, int j4, int j5, int j6,\n    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\n\n  std::complex<double> result =\n      FMPFsc_unsym(j1,j2,j3,j4,j5,j6,za,zb)\n    + FMPFsc_unsym(j4,j3,j2,j1,j6,j5,zb,za);\n\n  result = result; // @coverage-probe\n  return result;\n}\n\nextern \"C\" {\n  std::complex<double> fmpfsc_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\n      std::complex<double>* fza, std::complex<double>* fzb) {\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\n    return FMPFsc(j1, j2, j3, j4, j5, j6, za, zb);\n  }\n}\n"
