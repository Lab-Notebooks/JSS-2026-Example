# CodeScribe runner for the C++ -> Kokkos step.
#
# Reads the Spec and Plan in this folder, keeps the changing task list in an
# agent-created agent_checklist.md, and uses the helper programs in dev/tools/ (all plain
# python3 calls). Run it from the project root, with the environment already set up (for
# example, through jobrunner):
#
#   code-scribe loop -p dev/transformations/cpp-to-kokkos/loop.toml -m <model>
#
# It runs a writer-then-reviewer loop, up to five rounds: one pass writes the code, a second
# pass reviews it, and the two repeat until the review is happy or five rounds are used up.
#
# [tools].bash lists the extra commands the writer may run. It applies to the writing phase
# only; the review phase has its own, read-mostly, list.

[tools]
bash = ["jobrunner", "python3"]

[[chat.user]]
content = '''
Read dev/transformations/cpp-to-kokkos/current_plan.md first — it says how to run this step
(the tools, which target to do next, the authoring steps, the splitting procedure, and the
notes from past sessions) — then read dev/transformations/cpp-to-kokkos/desired_spec.md for
what a kernel should look like and how to tell it is correct.

If software/mcfm or software/pepper have never been built, run `jobrunner submit tests/mcfm`
then `jobrunner submit tests/pepper` once first — the Closure tool and the compare-against-MCFM
harness both need a built libmcfm.

Keep the changing task list in dev/transformations/cpp-to-kokkos/agent_checklist.md: create it
if it isn't there yet, then work through it. Use the Closure tool to pick and size targets per
the Plan's Resolution rules — only do amplitudes whose C++ dependencies a person has already
marked VERIFIED in dev/transformations/fortran-to-cpp/agent_checklist.md. Use Kokkosify for the
mechanical first draft, then write the rest of the kernel following the Spec's rewriting rules.

Compare each kernel against `libmcfm` with the compare-against-MCFM harness as you write it,
block by block, aiming for the Spec's 1e-10 relative tolerance. Check your work with
`jobrunner submit tests/pepper`; run it to root out compile/link errors and runtime crashes and
to confirm the existing tests still pass. Do NOT author new reference doctests — adding those
is the developer's job (see the Spec's correctness bar) — so mark each amplitude TRANSLATED
(matches libmcfm, builds, existing tests pass) or FAILED, never VERIFIED; note in
agent_checklist.md which doctests the developer should add.

Respect the approval gate: a person signs off each review group by writing an `APPROVED` line
under its heading in agent_checklist.md. Do not start a new group while an earlier, completed
group is unapproved — run
`python3 dev/tools/approve/check_gate.py dev/transformations/cpp-to-kokkos/agent_checklist.md`
and, if it fails, stop and leave the finished group for a person to review. At the end of each
round, before you stop, update agent_checklist.md and add a dated note to the Plan's session
log with what you did and what is left, so the next round knows what to do.
'''
