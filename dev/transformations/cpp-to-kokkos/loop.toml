# CodeScribe loop for C++ -> Kokkos.
#
# Run from the project root:
#   code-scribe loop -p dev/transformations/cpp-to-kokkos/loop.toml -m <model>

[tools]
bash = ["jobrunner", "python3"]

[[chat.user]]
content = '''
Read, in order:
1. dev/transformations/cpp-to-kokkos/current_plan.md
2. dev/transformations/cpp-to-kokkos/desired_spec.md

Each round:
1. If MCFM or Pepper is not built yet, run `jobrunner submit tests/mcfm` and
   `jobrunner submit tests/pepper` once.
2. Keep the working checklist in dev/transformations/cpp-to-kokkos/agent_checklist.md.
   Create it if missing. Follow the Plan's resolution rules.
3. Pick only amplitudes whose step-1 dependencies are VERIFIED in
   dev/transformations/fortran-to-cpp/agent_checklist.md.
4. Use Closure to choose and size targets. Use Kokkosify for a first draft, then finish the
   kernel from the Spec.
5. Validate against libmcfm as you write, block by block, targeting 1e-10 relative error.
6. Run `jobrunner submit tests/pepper`. Do not write new doctests. Mark amplitudes only as
   TRANSLATED or FAILED; note which doctests a developer should add.
7. Before starting a new review group, enforce the gate:
   python3 dev/tools/approve/check_gate.py dev/transformations/cpp-to-kokkos/agent_checklist.md
   If it fails, stop.
8. Before stopping, update agent_checklist.md and append a dated session note to the Plan.
'''
