# CodeScribe runner for the C++ -> Kokkos step.
#
# Same job as the Claude Code `port` (and `validate`) workflow, with a different runner.
# Both read the same two files (the Spec and Plan in this folder) and the same helper
# programs in dev/tools/. Run it from the project root, with the environment already set up
# (for example, through jobrunner):
#
#   code-scribe loop -p dev/transformations/cpp-to-kokkos/loop.toml -m <model>
#
# It runs a writer-then-reviewer loop, up to five rounds. See the paper, "The CodeScribe loop".
#
# [tools].bash lists the extra commands the writer may run. It applies to the writing phase
# only; the review phase has its own, read-mostly, list.

[tools]
bash = ["jobrunner", "cmake", "make", "python3", "bash"]

[[chat.user]]
content = '''
Read dev/transformations/cpp-to-kokkos/desired_spec.md for what the kernel should look like
and how to tell it is correct, then read dev/transformations/cpp-to-kokkos/current_plan.md
for the amplitudes to do and the notes. Do as many as you can, in order of need, and check
your work.

Use the helper programs in dev/tools/ that the Spec names: the Closure program to list what
an amplitude calls and confirm it is step-1 ready, the Kokkosify program for the easy
rewrites, and the compare harness to check each block against libmcfm while you write. Only
do amplitudes whose C++ dependencies a person has already marked VERIFIED in
dev/transformations/fortran-to-cpp/current_plan.md.

A kernel counts as correct ("verified") only when Pepper's tests pass; build Pepper and run
them with `jobrunner submit tests/pepper`. Write each amplitude's result (verified /
translated / failed) in current_plan.md, and before you stop, update the plan with anything
still left so the next round knows what to do.
'''
