# CodeScribe loop for Fortran -> C++.
#
# Run from the project root:
#   code-scribe loop -p dev/transformations/fortran-to-cpp/loop.toml -m <model>

[tools]
bash = ["jobrunner", "python3"]

[[chat.user]]
content = '''
Read, in order:
1. dev/transformations/fortran-to-cpp/current_plan.md
2. dev/transformations/fortran-to-cpp/desired_spec.md

Operate in this order each round:
1. Refresh readiness:
   python3 dev/tools/index/build_roadmap.py --doxygen
   python3 dev/tools/index/build_roadmap.py
2. Open or update dev/transformations/fortran-to-cpp/agent_checklist.md.
3. Determine whether there is an existing open review group. If there is, continue working in
   that group. Do not stop just because it is not yet approved.
4. Run `python3 dev/tools/approve/check_gate.py dev/transformations/fortran-to-cpp/agent_checklist.md`
   only to decide whether you may start a new group. A gate failure means: an earlier completed
   group needs human approval before any new group starts. It does NOT forbid continuing work,
   fixes, builds, or verification inside the current open group.
5. If build, test, or verification work is needed and MCFM is not built yet, run
   `jobrunner submit tests/mcfm` before trying to verify files.
6. Only rewrite ready files. Use Draft for a first cut, then write the real translation from
   the Spec. Rewrite one file at a time. Never invent a symbol.
7. After edits, build and verify. Apply fixes if the build or checks fail. Do not stop merely
   because a review group exists; stop only when you are blocked waiting for human approval to
   start the next group, or when there is no ready work.
8. Verify each file immediately with Coverage and mark it VERIFIED, TRANSLATED, or FAILED.
9. Before stopping, update agent_checklist.md and append a dated session note to the Plan.

Graceful exit conditions:
- Stop for human review only when a completed group blocks starting another group.
- Stop when there is no ready file to work on.
- Otherwise keep building, fixing, verifying, and finishing the current group.
'''
