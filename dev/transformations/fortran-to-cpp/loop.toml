# CodeScribe runner for the Fortran -> C++ step.
#
# This does the same job as the Claude Code `translate` workflow, with a different runner.
# Both read the same two files (the Spec and Plan in this folder) and the same helper
# programs in dev/tools/. Run it from the project root, with the environment already set up
# (for example, through jobrunner):
#
#   code-scribe loop -p dev/transformations/fortran-to-cpp/loop.toml -m <model>
#
# It runs a writer-then-reviewer loop, up to five rounds. See the paper, "The CodeScribe loop".
#
# [tools].bash lists the extra commands the writer may run. It applies to the writing phase
# only; the review phase has its own, read-mostly, list.

[tools]
bash = ["jobrunner", "cmake", "make", "python3", "nm"]

[[chat.user]]
content = '''
Read dev/transformations/fortran-to-cpp/desired_spec.md for what the code should look like
and how to tell it is correct, then read dev/transformations/fortran-to-cpp/current_plan.md
for the groups of files to do, what is left, and the notes. Do as much of the plan as you
can, and check your work.

Use the helper programs in dev/tools/ that the Spec names: the Index program to find which
files are ready, and the Draft program for a rough first draft and hints. Rewrite one file
at a time, follow the Spec's rules, and never invent a name that is not in the source.

A file counts as correct ("verified") only when a test actually runs it and the Spec's
coverage check passes; build and run the tests with `jobrunner submit tests/mcfm`. Write each
file's result (verified / translated / failed) in current_plan.md, and before you stop,
update the plan with anything still left so the next round knows what to do.
'''
