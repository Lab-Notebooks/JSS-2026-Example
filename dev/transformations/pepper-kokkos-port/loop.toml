# CodeScribe loop for C++ -> Kokkos.
#
# Run from the project root:
#   code-scribe loop -p dev/transformations/pepper-kokkos-port/loop.toml -m <model>

[tools]
bash = ["jobrunner", "python3"]

[[chat.user]]
content = '''
Each round, follow the round algorithm in dev/transformations/pepper-kokkos-port/current_plan.md
and the contract in dev/transformations/pepper-kokkos-port/desired_spec.md. Read the plan first,
then the spec.

Authority: current_plan.md and desired_spec.md are human-owned — read, do not modify.
agent_log.md is the only file in dev/transformations/pepper-kokkos-port/ that the AI may modify.
On conflict, the Spec governs.
'''
