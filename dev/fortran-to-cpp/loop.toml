# CodeScribe orchestrator input for the Fortran -> C++ transformation.
#
# CodeScribe is the REFERENCE orchestrator (a collaborator's agent with special
# capabilities — its index/draft/translate mechanics are replicated here as tools +
# the Claude Code workflow). It is not run in this artifact. This file is kept to
# document how that reference loop would be pointed at the SAME documents the Claude
# Code workflow reads — desired_spec.md and current_plan.md — under the same
# verification bar (paper §4.3, Fig. 4).

# [tools].bash is a HARD guardrail: the executor physically cannot run a command
# outside this allowlist. Unlike soft, natural-language guardrails in a prompt, it
# is a bound that makes an otherwise open-ended loop safe to leave running. It binds
# only the execution phase; the review phase runs under its own near-read-only allowlist.
[tools]
bash = ["make", "cmake", "nm", "python3"]

# The seed turn, passed as chat history. The actual per-iteration instruction is
# built by the orchestrator and directs the executor to advance the plan as far as
# possible in one session rather than to implement a single item and defer.
[[chat.user]]
content = '''

Read dev/fortran-to-cpp/desired_spec.md for the target code specification and the
verification bar, then review dev/fortran-to-cpp/current_plan.md for pending tasks
and working notes. Implement as much of the plan as you can, and verify your work
against the coverage probe and 1e-13 numerical bar in the spec.

Use the seed examples in dev/fortran-to-cpp/seed_examples.toml as translation
references. Author independent files first, then integrate and build serially.
Before finishing, update the plan with any remaining `[ ]` tasks so the next
iteration knows what work is left.

'''
